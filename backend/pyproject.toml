[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge"
version = "0.1.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic-settings==2.16.2",
  "psycopg[binary]==3.3.6", "psycopg-pool==3.3.3", "minio==7.2.20",
  "alembic==1.20.1", "SQLAlchemy==2.1.8", "httpx==0.28.1",
  "langgraph==1.2.20", "langchain-openai==1.7.4",
  "langgraph-checkpoint-postgres==3.2.0"
]
[project.optional-dependencies]
test = ["pytest==9.2.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"modelforge.runtimes" = ["*.json", "*.sh"]
[tool.pytest.ini_options]
testpaths = ["tests"]
