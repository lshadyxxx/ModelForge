<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ModelForge 数据集模块 · 三方案原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主要内容</a>

  <header class="review-bar" aria-label="原型方案选择">
    <div class="review-context">
      <span class="prototype-label">PROTOTYPE</span>
      <div>
        <strong>数据集模块重构</strong>
        <small>同一份真实数据形态，三种信息组织方式</small>
      </div>
    </div>

    <div class="variant-tabs" role="tablist" aria-label="选择设计方案">
      <button class="variant-tab" type="button" role="tab" data-action="set-variant" data-variant="a" aria-selected="false">
        <span class="variant-letter">A</span>
        <span><strong>三栏操作台</strong><small>管理优先</small></span>
      </button>
      <button class="variant-tab" type="button" role="tab" data-action="set-variant" data-variant="b" aria-selected="false">
        <span class="variant-letter">B</span>
        <span><strong>版本账本</strong><small>追溯优先</small></span>
      </button>
      <button class="variant-tab" type="button" role="tab" data-action="set-variant" data-variant="c" aria-selected="false">
        <span class="variant-letter">C</span>
        <span><strong>审阅工作室</strong><small>编辑优先 · 推荐</small></span>
      </button>
    </div>

    <div class="review-tools">
      <button class="icon-button review-tool" type="button" data-action="toggle-density" aria-label="切换信息密度" title="切换信息密度">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <button class="icon-button review-tool" type="button" data-action="toggle-theme" aria-label="切换明暗主题" title="切换明暗主题">
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"></path></svg>
      </button>
    </div>
  </header>

  <div id="app"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js" defer></script>
</body>
</html>
