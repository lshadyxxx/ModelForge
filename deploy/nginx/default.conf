server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location ~ ^/api/v1/model-versions/[^/]+/(files|complete|resume)$ {
        set $api_upstream http://api:8102;
        proxy_pass $api_upstream$request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        client_max_body_size 0; # Per-file size and streaming limits are enforced by the API.
        error_page 502 504 = @api_unavailable;
    }
    # Dataset create and append stream into the API's configured, bounded reader.
    location ~ ^/api/v1/datasets(?:/[^/]+/versions)?$ {
        set $api_upstream http://api:8102;
        proxy_pass $api_upstream$request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        client_max_body_size 0;
        error_page 502 504 = @api_unavailable;
    }
    # Snapshot resolution can use the source client's bounded 30-second timeout.
    location = /api/v1/models/modelscope-imports {
        set $api_upstream http://api:8102;
        proxy_pass $api_upstream$request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 40s;
        client_max_body_size 2m;
        error_page 413 = @api_too_large;
        error_page 502 504 = @api_unavailable;
    }
    # Adapter export verifies every persisted byte before sending a bounded ZIP.
    location ~ ^/api/v1/serving/adapters/[^/]+/download$ {
        set $api_upstream http://api:8102;
        proxy_pass $api_upstream$request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        client_max_body_size 2m;
        error_page 502 504 = @api_unavailable;
    }
    # Remote start/poll/cancel calls are bounded at 40 seconds per RPC. Keep SSE
    # unbuffered and tolerate startup/cancel barriers without cutting the stream.
    location ~ ^/api/v1/serving/trials/[^/]+/chat$ {
        set $api_upstream http://api:8102;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 2m;
        error_page 413 = @api_too_large;
        error_page 502 504 = @api_unavailable;
    }
    location /api/ {
        set $api_upstream http://api:8102;
        proxy_pass $api_upstream$request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
        error_page 413 = @api_too_large;
        error_page 502 504 = @api_unavailable;
    }
    location @api_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"file_too_large","message":"Request body too large"},"request_id":"$request_id"}';
    }
    location @api_unavailable {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 503 '{"error":{"code":"dependency_unavailable","message":"API service unavailable"},"request_id":"$request_id"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
