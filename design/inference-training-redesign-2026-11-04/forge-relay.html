<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <script src="prototype-readable.js" defer></script>
  <title>合流台 · ModelForge 推理训练合并方案</title>
  <style>
    :root {
      --ground: #edf1f3;
      --panel: #f8fafb;
      --panel-strong: #ffffff;
      --panel-soft: #f2f6f7;
      --graphite: #14232b;
      --graphite-2: #1c303a;
      --ink: #162129;
      --ink-2: #32424b;
      --muted: #566a73;
      --faint: #596c75;
      --line: #c9d4da;
      --line-soft: #e0e8eb;
      --blue: #245ad0;
      --blue-deep: #1745a4;
      --blue-soft: #e9f0ff;
      --copper: #ad4f2c;
      --copper-deep: #7f351d;
      --copper-soft: #f5e6dc;
      --receipt: #f7f1e6;
      --receipt-line: #d4c2ae;
      --receipt-ink: #332820;
      --teal: #0b777d;
      --teal-soft: #e1f2f2;
      --green: #1c704c;
      --green-soft: #e2f0e7;
      --amber: #8b5a0e;
      --amber-soft: #fbf0d8;
      --red: #a63d38;
      --red-soft: #fae8e6;
      --log: #112027;
      --log-soft: #1a3039;
      --display: "Bahnschrift SemiCondensed", "Bahnschrift", "Arial Narrow", "Microsoft YaHei UI", sans-serif;
      --sans: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --mono: "Cascadia Code", "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --radius: 2px;
      --shadow: 0 18px 48px rgba(26, 42, 50, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(20, 35, 43, .028) 1px, transparent 1px),
        linear-gradient(rgba(20, 35, 43, .022) 1px, transparent 1px),
        var(--ground);
      background-size: 28px 28px, 28px 28px, auto;
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.55;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(36, 90, 208, .38);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .45; }
    a { color: inherit; }
    svg { display: block; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    ::selection { color: #fff; background: var(--copper); }
    * { scrollbar-width: thin; scrollbar-color: #9eacb3 transparent; }

    .topbar {
      position: sticky; top: 0; z-index: 45;
      min-height: 58px;
      display: flex; align-items: center; gap: 22px;
      padding: 0 20px;
      color: #eaf0f2;
      background: rgba(20, 35, 43, .98);
      border-bottom: 1px solid rgba(234, 240, 242, .16);
      box-shadow: inset 0 -2px 0 var(--copper);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 214px; }
    .brand-mark {
      width: 30px; height: 32px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.38);
      color: #fff; font-family: var(--display); font-size: 18px; letter-spacing: -.04em;
      box-shadow: inset 0 -4px 0 var(--copper);
    }
    .brand strong { display: block; font-size: 14px; letter-spacing: .01em; }
    .brand small { display: block; margin-top: 1px; color: #a6b7c0; font-family: var(--mono); font-size: 8px; letter-spacing: .12em; }
    .crumb {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      color: #91a4ae; font-family: var(--mono); font-size: 9px; letter-spacing: .02em;
    }
    .crumb b { color: #dce7eb; font-weight: 500; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; }
    .connection { display: inline-flex; align-items: center; gap: 7px; color: #a4b7c0; font-family: var(--mono); font-size: 9px; white-space: nowrap; }
    .connection i { width: 8px; height: 8px; border-radius: 50%; background: #64c79a; border: 1px solid #4b9073; }
    .snapshot-time { color: #7e929d; font-family: var(--mono); font-size: 8px; white-space: nowrap; }
    .scenario-select {
      min-height: 40px; max-width: 148px; padding: 0 8px;
      border: 1px solid #3d505a; background: #192a33; color: #dbe6ea;
      font-family: var(--mono); font-size: 9px;
    }
    .top-button {
      min-height: 40px; display: inline-flex; align-items: center; gap: 7px;
      padding: 0 12px; border: 1px solid #4c606a; background: transparent; color: #e2eaee;
      font-size: 10px; font-weight: 600;
    }
    .top-button:hover { background: #1f3540; border-color: #6c828d; }

    .app { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100dvh - 58px); }
    .sidebar {
      position: sticky; top: 58px; z-index: 20;
      height: calc(100dvh - 58px); padding: 19px 14px 14px;
      display: flex; flex-direction: column;
      color: #c5d1d7; background: #172730; border-right: 1px solid #29404b;
    }
    .workspace-label { padding: 0 8px 16px; border-bottom: 1px solid #2a414c; }
    .workspace-label small { display: block; color: #758b96; font-family: var(--mono); font-size: 8px; letter-spacing: .14em; }
    .workspace-label strong { display: block; margin-top: 5px; color: #eff5f7; font-size: 12px; font-weight: 550; }
    .side-nav { margin-top: 13px; display: grid; gap: 3px; }
    .nav-item {
      position: relative; min-height: 42px; display: flex; align-items: center; gap: 10px;
      padding: 0 9px; border: 0; background: transparent; color: #a8bac3;
      text-align: left; font-size: 11px;
    }
    .nav-item:hover { color: #f1f5f7; background: #1d323c; }
    .nav-item.active { color: #fff; background: #223b47; box-shadow: inset 2px 0 0 #65a1ff; }
    .nav-item .nav-index { margin-left: auto; color: #9eb0b9; font-family: var(--mono); font-size: 8px; }
    .nav-item.active .nav-index { color: #9fbeff; }
    .side-nav-divider { height: 1px; margin: 12px 0; background: #29414c; }
    .side-caption { padding: 0 9px; color: #9eb0b9; font-family: var(--mono); font-size: 8px; letter-spacing: .12em; }
    .sidebar-foot { margin-top: auto; padding: 12px 9px 2px; border-top: 1px solid #2a414c; color: #768b95; font-size: 9px; line-height: 1.65; }
    .sidebar-foot strong { display: block; color: #c8d6dc; font-size: 10px; font-weight: 500; }
    .sidebar-foot span { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .sidebar-foot i { width: 5px; height: 5px; border-radius: 50%; background: #64c79a; }

    .workspace {
      display: grid; grid-template-columns: 248px minmax(0, 1fr) 286px;
      align-items: start; min-width: 0;
    }
    .ledger {
      position: sticky; top: 58px;
      height: calc(100dvh - 58px); overflow: auto;
      background: #f5f8f9; border-right: 1px solid var(--line);
    }
    .ledger-head { padding: 19px 15px 13px; border-bottom: 1px solid var(--line); }
    .ledger-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .ledger-title-row h1, .ledger-title-row h2 { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: -.02em; line-height: 1.1; font-weight: 650; }
    .ledger-title-row p { margin: 4px 0 0; color: var(--muted); font-family: var(--mono); font-size: 8px; letter-spacing: .04em; }
    .count-badge { min-width: 27px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel-strong); color: var(--ink-2); font-family: var(--mono); font-size: 9px; }
    .queue-close { display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line); background: var(--panel-strong); color: var(--muted); }
    .queue-close:hover { color: var(--ink); background: var(--panel-soft); }
    .search-box { position: relative; margin-top: 13px; }
    .search-box .icon { position: absolute; left: 9px; top: 12px; color: var(--faint); }
    .search-box input {
      width: 100%; min-height: 40px; padding: 0 10px 0 31px;
      border: 1px solid var(--line); background: var(--panel-strong); color: var(--ink); font-size: 10px;
    }
    .search-box input::placeholder { color: var(--faint); }
    .ledger-note { margin: 10px 0 0; color: var(--faint); font-size: 9px; line-height: 1.55; }
    .queue-groups { padding: 9px 10px 18px; }
    .queue-group { margin-top: 8px; }
    .group-head {
      min-height: 29px; display: flex; align-items: center; gap: 7px;
      padding: 0 5px; color: var(--muted); font-family: var(--mono); font-size: 8px; letter-spacing: .08em;
    }
    .group-head span { margin-left: auto; color: var(--faint); }
    .group-head::before { content: ""; width: 11px; height: 1px; background: var(--line); }
    .run-card {
      width: 100%; margin: 0 0 5px; display: block; padding: 12px 11px 11px;
      border: 1px solid transparent; border-left: 2px solid transparent;
      background: transparent; color: var(--ink); text-align: left;
    }
    .run-card:hover { border-color: var(--line); border-left-color: #8da4ae; background: var(--panel-strong); }
    .run-card.active { border-color: var(--line); border-left-color: var(--blue); background: var(--panel-strong); }
    .run-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .run-name { margin: 0; font-size: 11px; font-weight: 650; line-height: 1.4; }
    .run-code { margin: 4px 0 0; color: var(--faint); font-family: var(--mono); font-size: 8px; }
    .run-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; color: var(--faint); font-family: var(--mono); font-size: 8px; }
    .run-progress { height: 3px; margin-top: 9px; background: var(--line-soft); }
    .run-progress i { display: block; height: 100%; background: var(--blue); }
    .run-progress.success i { background: var(--green); }
    .run-progress.failed i { background: var(--red); }
    .ledger-foot { padding: 12px 15px; border-top: 1px solid var(--line); color: var(--faint); font-family: var(--mono); font-size: 8px; }

    .stage { min-width: 0; min-height: calc(100dvh - 58px); background: var(--panel); border-right: 1px solid var(--line); }
    .stage-head {
      position: relative;
      padding: 20px 24px 0;
      background:
        linear-gradient(90deg, rgba(36,90,208,.035) 1px, transparent 1px),
        linear-gradient(rgba(36,90,208,.028) 1px, transparent 1px),
        var(--panel-strong);
      background-size: 24px 24px, 24px 24px, auto;
      border-bottom: 1px solid var(--line);
      box-shadow: inset 0 2px 0 var(--copper);
    }
    .stage-head::after {
      content: "CONTROL SHEET / 01";
      position: absolute; right: 24px; top: 14px;
      color: #b3c0c6; font-family: var(--mono); font-size: 7px; letter-spacing: .13em;
    }
    .eyebrow { color: var(--blue); font-family: var(--mono); font-size: 8px; letter-spacing: .13em; text-transform: uppercase; }
    .stage-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-top: 5px; }
    .stage-title { min-width: 0; }
    .stage-title h1 {
      margin: 0; font-family: var(--display); font-size: clamp(27px, 2.6vw, 38px);
      line-height: 1.06; letter-spacing: -.025em; font-weight: 650;
      text-wrap: balance;
    }
    .stage-title p { margin: 7px 0 0; color: var(--muted); font-family: var(--mono); font-size: 9px; overflow-wrap: anywhere; }
    .stage-actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; }
    .status-pill {
      min-height: 32px; display: inline-flex; align-items: center; gap: 6px;
      padding: 0 9px; border: 1px solid var(--line); background: var(--panel-strong);
      color: var(--muted); font-family: var(--mono); font-size: 8px; white-space: nowrap;
    }
    .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-pill.running { color: var(--blue); border-color: #b8cdf6; background: var(--blue-soft); }
    .status-pill.success { color: var(--green); border-color: #b9d8c6; background: var(--green-soft); }
    .status-pill.waiting { color: var(--amber); border-color: #e4cc99; background: var(--amber-soft); }
    .status-pill.danger { color: var(--red); border-color: #e2bcb8; background: var(--red-soft); }
    .stage-tabs { display: flex; gap: 2px; margin-top: 18px; overflow-x: auto; scrollbar-width: thin; }
    .tab {
      position: relative; min-height: 44px; padding: 0 13px; border: 0; border-bottom: 2px solid transparent;
      background: transparent; color: var(--muted); white-space: nowrap; font-size: 10px;
    }
    .tab:hover { color: var(--ink); background: rgba(36, 90, 208, .035); }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 650; }
    .tab-lock { margin-left: 5px; color: var(--faint); font-family: var(--mono); font-size: 7px; }
    .stage-body { padding: 20px 24px 40px; }

    .queue-toggle { display: none; min-height: 38px; padding: 0 10px; border: 1px solid var(--line); background: var(--panel-strong); color: var(--ink-2); font-size: 10px; }
    .button {
      min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 0 13px; border: 1px solid var(--blue); background: var(--blue); color: #fff;
      font-size: 10px; font-weight: 650; border-radius: var(--radius);
    }
    .button:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
    .button.secondary { color: var(--ink-2); border-color: var(--line); background: var(--panel-strong); font-weight: 550; }
    .button.secondary:hover { border-color: #9eafb7; background: #fff; }
    .button.ghost { color: var(--blue); border-color: transparent; background: transparent; padding-inline: 8px; }
    .button.ghost:hover { background: var(--blue-soft); }
    .button.danger { color: var(--red); border-color: #d9aba7; background: transparent; }
    .button.danger:hover { background: var(--red-soft); border-color: var(--red); }
    .button.small { min-height: 40px; font-size: 9px; padding-inline: 10px; }
    .button.full { width: 100%; }

    .route-wrap { border: 1px solid var(--line); background: var(--panel-strong); }
    .route-head { min-height: 37px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 13px; border-bottom: 1px solid var(--line-soft); }
    .route-head strong { font-family: var(--mono); font-size: 8px; letter-spacing: .09em; color: var(--muted); font-weight: 500; }
    .route-head span { color: var(--faint); font-family: var(--mono); font-size: 8px; }
    .route { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .route-node { position: relative; min-width: 0; padding: 13px 11px 12px; border-right: 1px solid var(--line-soft); }
    .route-node:last-child { border-right: 0; }
    .route-node::after {
      content: ""; position: absolute; top: 18px; right: -4px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--line); z-index: 2;
    }
    .route-node:last-child::after { display: none; }
    .route-node .route-index { display: flex; align-items: center; gap: 7px; color: var(--faint); font-family: var(--mono); font-size: 8px; }
    .route-index b {
      width: 18px; height: 18px; display: grid; place-items: center;
      border: 1px solid var(--line); background: var(--panel-soft); color: var(--faint); font-weight: 500;
    }
    .route-node strong { display: block; margin-top: 7px; font-size: 10px; color: var(--ink-2); }
    .route-node small { display: block; margin-top: 3px; color: var(--faint); font-size: 8px; line-height: 1.45; }
    .route-node.done::after { background: var(--green); }
    .route-node.done b { color: #fff; border-color: var(--green); background: var(--green); }
    .route-node.active { background: #f6f9ff; box-shadow: inset 0 -2px 0 var(--blue); }
    .route-node.active::after { background: var(--blue); }
    .route-node.active b { color: #fff; border-color: var(--blue); background: var(--blue); }
    .route-node.ready { background: var(--green-soft); }
    .route-node.ready::after { background: var(--green); }
    .route-node.ready b { color: var(--green); border-color: #9bc6ad; background: #fff; }
    .route-node.fail { background: var(--red-soft); }
    .route-node.fail::after { background: var(--red); }
    .route-node.fail b { color: #fff; border-color: var(--red); background: var(--red); }
    .route-node.fail strong { color: var(--red); }

    .metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 14px; border: 1px solid var(--line); background: var(--panel-strong); }
    .metric { min-width: 0; padding: 14px 14px 13px; border-right: 1px solid var(--line-soft); }
    .metric:last-child { border-right: 0; }
    .metric small { display: block; color: var(--muted); font-family: var(--mono); font-size: 8px; letter-spacing: .06em; }
    .metric strong { display: block; margin-top: 6px; font-family: var(--display); font-size: clamp(21px, 2.2vw, 30px); letter-spacing: -.035em; font-weight: 600; line-height: 1; }
    .metric span { display: block; margin-top: 6px; color: var(--faint); font-size: 8px; line-height: 1.45; }
    .metric.accent strong { color: var(--blue); }

    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 14px; margin-top: 14px; }
    .section { border: 1px solid var(--line); background: var(--panel-strong); min-width: 0; }
    .section-head { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line-soft); }
    .section-head h2 { margin: 0; font-family: var(--display); font-size: 19px; letter-spacing: -.015em; font-weight: 600; }
    .section-head p { margin: 2px 0 0; color: var(--muted); font-size: 9px; }
    .section-meta { color: var(--faint); font-family: var(--mono); font-size: 8px; white-space: nowrap; }
    .chart-wrap { padding: 10px 12px 9px; }
    .loss-chart { width: 100%; height: auto; min-height: 220px; }
    .chart-grid { stroke: #dbe4e8; stroke-width: 1; }
    .chart-axis { fill: #87979f; font-family: var(--mono); font-size: 8px; }
    .chart-train { fill: none; stroke: var(--blue); stroke-width: 2; }
    .chart-eval { fill: none; stroke: var(--amber); stroke-width: 1.6; stroke-dasharray: 5 4; }
    .chart-dot { fill: #fff; stroke: var(--blue); stroke-width: 2; }
    .chart-dot.eval { stroke: var(--amber); }
    .chart-marker { stroke: #9cb5e6; stroke-width: 1; stroke-dasharray: 3 3; }
    .chart-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; padding: 0 12px 10px; color: var(--muted); font-family: var(--mono); font-size: 8px; }
    .chart-legend i { display: inline-block; width: 16px; height: 2px; margin-right: 5px; vertical-align: middle; background: var(--blue); }
    .chart-legend .eval i { background: var(--amber); }
    .chart-legend span:last-child { margin-left: auto; color: var(--faint); }
    .event-list { list-style: none; margin: 0; padding: 4px 14px 10px; }
    .event-item { display: grid; grid-template-columns: 52px 9px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
    .event-item:last-child { border-bottom: 0; }
    .event-item time { color: var(--faint); font-family: var(--mono); font-size: 8px; padding-top: 2px; }
    .event-item i { width: 5px; height: 5px; margin-top: 5px; border-radius: 50%; background: var(--green); }
    .event-item.warn i { background: var(--amber); }
    .event-item.bad i { background: var(--red); }
    .event-item strong { display: block; color: var(--ink-2); font-size: 9px; font-weight: 550; }
    .event-item p { margin: 2px 0 0; color: var(--muted); font-size: 8px; line-height: 1.55; }
    .event-foot { padding: 9px 14px; border-top: 1px solid var(--line-soft); }
    .event-foot .button { width: 100%; }

    .run-brief { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; border: 1px solid var(--line); background: var(--panel-strong); }
    .run-brief div { min-width: 0; padding: 12px 13px; border-right: 1px solid var(--line-soft); }
    .run-brief div:last-child { border-right: 0; }
    .run-brief small { display: block; color: var(--muted); font-family: var(--mono); font-size: 8px; }
    .run-brief strong { display: block; margin-top: 4px; color: var(--ink-2); font-size: 10px; font-weight: 600; }
    .run-brief span { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; line-height: 1.55; }

    .acceptance-track { margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
    .acceptance-track-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .acceptance-track-head strong { color: var(--ink-2); font-family: var(--mono); font-size: 8px; font-weight: 500; letter-spacing: .09em; }
    .acceptance-track-head span { color: var(--faint); font-family: var(--mono); font-size: 8px; white-space: nowrap; }
    .phase-grid {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function statusMeta(run) {
      if (state.scenario === 'running') return {tone: 'running', label: 'RUNNING / 训练中', short: 'RUNNING'};

          state.sending = false;
          return;
        }
        cursor += Math.max(2, Math.ceil(answer.length / 28));
        const last = state.chat[state.chat.length - 1];
        last.content = answer.slice(0, cursor);
        last.partial = cursor < answer.length;
        const node = document.querySelector('#chat-stream .message.assistant:last-child .message-body p');
        if (node) node.textContent = last.content;
        if (cursor >= answer.length) {
          clearInterval(state.streamTimer);
          state.streamTimer = null;
          state.sending = false;
          last.partial = false;
          render();
        }
      }, 55);
    }
    function stopGeneration() {
      if (!state.sending) return;
      clearInterval(state.streamTimer);
      state.streamTimer = null;
      state.sending = false;
      const last = state.chat[state.chat.length - 1];
      if (last) {
        last.partial = true;
        last.content += '\n\n〔已停止生成，以上为部分输出〕';
      }
      render();
      toast('已停止本页流式演示；正式实现仍需向后端确认取消结果。');
    }
    function switchTab(view) {
      state.view = view;
      state.trialStopped = false;
      updateUrl();
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    }
    function openFlowStep(index) {
      if (index <= 1) { switchTab('overview'); return; }
      if (index === 2) { switchTab('logs'); return; }
      if (index === 3) { switchTab('artifacts'); return; }
      if (index === 4) {
        switchTab('artifacts');
        toast('资源回收证据位于发布回执与右侧门禁链：实例已删除、租约已释放。');
        return;
      }
      if (index === 5) {
        if (isSuccess() || isTrialError()) { handleAction('open-inference'); return; }
        toast(state.scenario === 'waiting' ? '先绑定手动实例，推理门禁尚未建立。' : '训练结束且 Best / Final 成对可用后，推理门禁才会打开。');
      }
    }
    function handleAction(action) {
      if (action === 'refresh') { toast('已刷新运行事实；旧快照保留直到新响应确认。'); return; }
      if (action === 'new-training') { state.wizardStep = 1; state.formError = ''; state.creating = false; setView('create'); return; }
      if (action === 'exit-create') { if (state.creating) return; setView('overview'); return; }
      if (action === 'wizard-jump') { return; }
      if (action === 'wizard-next') {
        if (state.wizardStep === 1) {
          const input = document.getElementById('task-name');
          state.taskName = (input?.value || state.taskName || '').trim();
          if (!state.taskName) {
            state.formError = '请先为本次训练命名。';
            render();
            setTimeout(() => document.getElementById('form-error')?.focus(), 20);
            return;
          }
          state.formError = '';
        }
        state.wizardStep = Math.min(4, state.wizardStep + 1);
        updateUrl(); render(); window.scrollTo({top:0,behavior:'smooth'}); return;
      }
      if (action === 'wizard-back') {
        if (state.wizardStep === 1) { setView('overview'); return; }
        state.wizardStep -= 1; updateUrl(); render(); return;
      }
      if (action === 'wizard-submit') { openDialog('create'); return; }
      if (action === 'confirm-create') {
        closeDialog(); state.creating = true; render();
        setTimeout(() => {
          state.creating = false; state.scenario = 'waiting'; state.view = 'overview'; state.wizardStep = 1;
          updateUrl(); render(); toast('任务已冻结，进入 waiting_instance；请手动创建并绑定实例。');
        }, 950); return;
      }
      if (action === 'request-bind') { openDialog('bind'); return; }
      if (action === 'confirm-bind') {
        const id = document.getElementById('bind-instance')?.value.trim();
        const ack = document.getElementById('bind-ack')?.checked;
        if (!id || !ack) { toast('请填写实例 ID 并确认清理授权。'); return; }
        closeDialog(); state.scenario = 'loading'; render();
        setTimeout(() => { state.scenario = 'running'; state.view = 'overview'; updateUrl(); render(); toast('实例已绑定并进入运行时检查；训练即将开始。'); }, 900);
        return;
      }
      if (action === 'open-inference') { state.scenario = 'success'; state.view = 'inference'; state.trialStopped = false; updateUrl(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if (action === 'open-artifacts' || action === 'tab-artifacts') { switchTab('artifacts'); return; }
      if (action === 'tab-logs') { switchTab('logs'); return; }
      if (action === 'request-cancel') { openDialog('cancel'); return; }
      if (action === 'confirm-cancel') { closeDialog(); state.cancelRequested = true; render(); toast('取消请求已记录；等待进程退出、实例删除与租约释放确认。'); return; }
      if (action === 'request-cleanup') { openDialog('cleanup'); return; }
      if (action === 'confirm-cleanup') { closeDialog(); state.cleanupRequested = true; render(); toast('回收请求已记录；原型不会调用云接口。'); return; }
      if (action === 'request-stop') { openDialog('stop'); return; }
      if (action === 'confirm-stop') { closeDialog(); state.trialStopped = true; render(); toast('结束指令已记录；等待实例删除与租约释放确认。'); return; }
      if (action === 'send-chat') {
        const value = document.getElementById('chat-input')?.value || state.chatDraft || '';
        sendChat(value); return;
      }
      if (action === 'stop-generation') { stopGeneration(); return; }
      if (action === 'download' || action === 'download-logs') { toast(action === 'download-logs' ? '原型：日志下载已模拟，不读取远程文件。' : '原型：Adapter 包校验通过，下载不连接 MinIO。'); return; }
      if (action === 'copy-handoff') {
        const run = activeRun();
        const contract = run ? `attempt=${run.short}&adapter=adapter-best-0${run.attempt}&role=best&base=${run.baseFingerprint}` : 'attempt=unavailable';
        navigator.clipboard?.writeText(contract).catch(() => {});
        toast('交接合同已复制：attempt / adapter / role / base fingerprint。');
        return;
      }
      if (action === 'copy-manifest') { navigator.clipboard?.writeText('客服意图训练集 v3 · Qwen3-0.6B · split-4f82b9d1 · LR 2e-4 · r8').catch(() => {}); toast('冻结快照摘要已复制。'); return; }
      if (action === 'inspect-data' || action === 'inspect-base') { toast(action === 'inspect-data' ? '数据证据在当前冻结版本中，不再重复选择。' : '基座指纹 Qwen3-0.6B-20261102-r1 与推理基线一致。'); return; }
      if (action === 'toggle-queue') { state.queueOpen = !state.queueOpen; render(); return; }
      if (action === 'close-dialog') { closeDialog(); return; }
      if (action === 'close-queue') { state.queueOpen = false; render(); return; }
      toast('原型未连接真实后端。');
    }

    document.addEventListener('click', (event) => {
      const nav = event.target.closest('[data-nav]');
      if (nav) {
        const key = nav.dataset.nav;
        if (key === 'training') { state.view = state.scenario === 'success' ? 'artifacts' : 'overview'; updateUrl(); render(); }
        else if (key === 'serving') { state.scenario = 'success'; state.view = 'inference'; state.trialStopped = false; updateUrl(); render(); }
        else if (key === 'datasets' || key === 'models' || key === 'compute') { toast('原型只覆盖「推理训练」链路；其他模块保持现状。'); }
        else { toast('工作台总览不在本轮原型范围。'); }
        return;
      }
      const runButton = event.target.closest('[data-select-run]');
      if (runButton) {
        const source = runButton.dataset.selectRun;
        state.scenario = source === 'current' ? 'running' : source === 'previous' ? 'success' : source === 'waiting' ? 'waiting' : 'error';
        state.view = source === 'previous' ? 'artifacts' : 'overview';
        state.queueOpen = false;
        state.trialStopped = false;
        updateUrl(); render(); window.scrollTo({top:0,behavior:'smooth'}); return;
      }
      const tab = event.target.closest('[data-tab]');
      if (tab) { switchTab(tab.dataset.tab); return; }
      const prompt = event.target.closest('[data-prompt]');
      if (prompt) { sendChat(prompt.dataset.prompt); return; }
      const actionNode = event.target.closest('[data-action]');
      if (!actionNode) return;
      if (actionNode.dataset.action === 'wizard-jump') {
        state.wizardStep = Number(actionNode.dataset.step);
        updateUrl(); render(); return;
      }
      if (actionNode.dataset.action === 'open-flow-step') {
        openFlowStep(Number(actionNode.dataset.step));
        return;
      }
      handleAction(actionNode.dataset.action);
    });
    document.addEventListener('change', (event) => {
      if (event.target.id === 'scenario-select') { setScenario(event.target.value); return; }
      if (event.target.id === 'log-level') { state.logLevel = event.target.value; render(); return; }
      if (event.target.id === 'follow-logs') { state.follow = event.target.checked; render(); return; }
    });
    document.addEventListener('input', (event) => {
      if (event.target.id === 'run-search') {
        state.search = event.target.value; render();
        const input = document.getElementById('run-search');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
        return;
      }
      if (event.target.id === 'log-search') {
        state.logQuery = event.target.value; render();
        const input = document.getElementById('log-search');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
        return;
      }
      if (event.target.id === 'task-name') { state.taskName = event.target.value; return; }
      if (event.target.id === 'chat-input') { state.chatDraft = event.target.value; return; }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.queueOpen) { state.queueOpen = false; render(); }
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && event.target.id === 'chat-input') {
        event.preventDefault();
        sendChat(event.target.value);
      }
    });

    render();
  </script>
</body>
</html>
