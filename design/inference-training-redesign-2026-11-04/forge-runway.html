<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <script src="prototype-readable.js" defer></script>
  <title>铸程线 · ModelForge 推理训练重设计</title>
  <style>
    :root {
      --paper: #f5f1e7;
      --paper-deep: #ece6d9;
      --surface: #fbf8f0;
      --surface-strong: #ffffff;
      --ink: #17211c;
      --ink-soft: #354039;
      --muted: #647067;
      --faint: #66746b;
      --line: #d8d1c2;
      --line-strong: #bbb3a4;
      --forest: #1f4f3e;
      --forest-deep: #133a2e;
      --forest-soft: #e2ece6;
      --copper: #c35b31;
      --copper-deep: #963d1d;
      --copper-soft: #f3e0d5;
      --gold: #7a5a17;
      --gold-soft: #f7ecd5;
      --danger: #a43e35;
      --danger-soft: #f8e3df;
      --success: #236947;
      --success-soft: #deeee5;
      --info: #346d75;
      --info-soft: #dfedef;
      --log: #141a17;
      --log-soft: #202a25;
      --display: "Songti SC", "STSong", "SimSun", Georgia, serif;
      --sans: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --mono: "Cascadia Code", "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --shadow: 0 16px 50px rgba(40, 34, 23, .08);
      --radius: 4px;
      --focus: #2c6da1;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 86% 8%, rgba(195, 91, 49, .055), transparent 27rem),
        linear-gradient(90deg, rgba(23, 33, 28, .028) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 72px 72px, auto;
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      min-width: 320px;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 68%, transparent);
      outline-offset: 3px;
    }
    a { color: inherit; }
    svg { display: block; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      min-height: 68px;
      display: flex; align-items: center; gap: 26px;
      padding: 0 30px;
      color: #e8eee7;
      background: rgba(21, 31, 26, .97);
      border-bottom: 1px solid rgba(232, 238, 231, .14);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 176px; }
    .brand-mark {
      width: 31px; height: 34px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.34);
      color: #f3c398; font-family: var(--display); font-size: 23px;
      box-shadow: inset 0 -5px 0 rgba(195, 91, 49, .52);
    }
    .brand-copy strong { display: block; font-size: 14px; letter-spacing: .02em; }
    .brand-copy small { display: block; margin-top: 1px; color: #aebbb2; font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
    .primary-nav { display: flex; align-self: stretch; gap: 2px; }
    .nav-link {
      min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px;
      border: 0; background: transparent; color: #aab7af; font-size: 12px;
      border-bottom: 2px solid transparent;
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,.04); }
    .nav-link.active { color: #fff; border-bottom-color: #e48a5f; }
    .topbar-meta { margin-left: auto; display: flex; align-items: center; gap: 20px; color: #aebbb2; font-size: 11px; }
    .system-state { display: inline-flex; align-items: center; gap: 7px; }
    .system-state i { width: 7px; height: 7px; border-radius: 50%; background: #77c39a; box-shadow: 0 0 0 4px rgba(119,195,154,.12); }
    .user-chip { width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.25); color: #f3c398; }
    .page { width: min(1460px, 100%); margin: 0 auto; padding: 38px 34px 70px; }
    .breadcrumbs {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      margin-bottom: 23px; color: var(--muted); font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    }
    .breadcrumbs span:last-child { color: var(--ink); }
    .breadcrumbs .slash { color: var(--line-strong); }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; margin-bottom: 32px; }
    .eyebrow { color: var(--copper-deep); font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; }
    .hero h1 {
      max-width: 900px; margin: 0;
      font-family: var(--display); font-size: clamp(38px, 4vw, 58px); font-weight: 600;
      letter-spacing: -.035em; line-height: 1.1; text-wrap: balance;
    }
    .hero-line { display: block; }
    .hero h1 em { color: var(--forest); font-style: normal; border-bottom: 1px solid rgba(31,79,62,.35); }
    .hero p { max-width: 700px; margin: 13px 0 0; color: var(--muted); font-size: 13px; }
    .hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .button {
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 0 17px; border: 1px solid var(--forest); border-radius: 2px;
      background: var(--forest); color: #fff; font-weight: 600; font-size: 12px;
      text-decoration: none; transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .button:hover { background: var(--forest-deep); border-color: var(--forest-deep); }
    .button:active { transform: translateY(1px); }
    .button.secondary { background: transparent; color: var(--ink); border-color: var(--line-strong); }
    .button.secondary:hover { background: var(--surface-strong); border-color: var(--ink-soft); }
    .button.ghost { background: transparent; color: var(--forest); border-color: transparent; padding-inline: 11px; }
    .button.ghost:hover { background: var(--forest-soft); }
    .button.danger { background: transparent; color: var(--danger); border-color: #d8aca7; }
    .button.danger:hover { background: var(--danger-soft); }
    .button.small { min-height: 44px; padding: 0 12px; font-size: 11px; }
    .button:disabled { cursor: not-allowed; opacity: .5; }
    .icon { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .panel { background: rgba(251,248,240,.86); border: 1px solid var(--line); }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 22px 24px 19px; }
    .section-head h2 { margin: 0; font-family: var(--display); font-size: 23px; line-height: 1.2; letter-spacing: -.02em; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .runway {
      position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line);
      margin-bottom: 22px; background: rgba(251,248,240,.62);
    }
    .runway::before {
      content: ""; position: absolute; top: 27px; left: 9%; right: 9%; height: 1px;
      background: var(--line); pointer-events: none;
    }
    .stage {
      position: relative; z-index: 1; min-height: 91px; padding: 17px 16px 15px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
      background: transparent; border: 0; border-right: 1px solid var(--line);
      text-align: left; color: var(--muted);
    }
    .stage:last-child { border-right: 0; }
    .stage:hover { background: rgba(255,255,255,.55); }
    .stage-index { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; }
    .stage-index span:first-child {
      width: 22px; height: 22px; display: grid; place-items: center;
      color: var(--muted); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 50%;
    }
    .stage strong { color: var(--ink-soft); font-size: 12px; font-weight: 650; }
    .stage small { color: var(--muted); font-size: 10px; }
    .stage.done .stage-index span:first-child { background: var(--forest); border-color: var(--forest); color: white; }
    .stage.active { background: var(--surface); box-shadow: inset 0 2px 0 var(--copper); }
    .stage.active .stage-index span:first-child { background: var(--copper); border-color: var(--copper); color: white; }
    .stage.active strong { color: var(--ink); }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(280px, .72fr); gap: 20px; }
    .current-run { min-width: 0; }
    .current-head { display: flex; justify-content: space-between; gap: 20px; padding: 24px 25px 18px; border-bottom: 1px solid var(--line); }
    .run-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .run-title { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.02em; }
    .run-sub { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .status {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      padding: 4px 8px; border: 1px solid transparent; border-radius: 2px;
      font-size: 10px; font-weight: 650;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.running { color: var(--success); background: var(--success-soft); }
    .status.waiting { color: var(--gold); background: var(--gold-soft); }
    .status.success { color: var(--success); background: var(--success-soft); }
    .status.error { color: var(--danger); background: var(--danger-soft); }
    .status.idle { color: var(--muted); background: var(--paper-deep); }
    .status.locked { color: var(--muted); background: var(--paper-deep); }
    .metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
    .metric { min-width: 0; padding: 18px 20px 16px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 7px; font-family: var(--mono); font-size: clamp(21px, 2vw, 27px); font-weight: 500; letter-spacing: -.04em; }
    .metric span { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; }
    .run-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, .92fr); }
    .run-narrative { padding: 23px 25px 22px; border-right: 1px solid var(--line); }
    .run-narrative h3, .evidence-side h3 { margin: 0; font-size: 13px; font-weight: 650; }
    .run-narrative > p { margin: 7px 0 19px; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .live-line { display: flex; align-items: flex-start; gap: 11px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 11px; }
    .live-line:last-of-type { border-bottom: 1px solid var(--line); }
    .live-line time { flex: 0 0 65px; color: var(--faint); font-family: var(--mono); font-size: 10px; }
    .live-line span { color: var(--ink-soft); }
    .run-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .curve-wrap {
      margin: 0; padding: 17px 18px 15px; color: #dce8df; background: var(--log); min-height: 250px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .curve-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .curve-title { font-size: 11px; color: #e8efea; }
    .curve-legend { display: flex; gap: 12px; font-size: 9px; color: #a9bab0; }
    .curve-legend i { width: 15px; height: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }
    .curve-legend .train { background: #8fc7aa; }
    .curve-legend .eval { background: #e5a97e; }
    .curve { width: 100%; height: 145px; margin: 9px 0 4px; overflow: visible; }
    .curve-grid { stroke: rgba(232,239,234,.12); stroke-width: 1; }
    .curve-axis { fill: #789089; font-family: var(--mono); font-size: 8px; }
    .curve-train { fill: none; stroke: #8fc7aa; stroke-width: 2.2; }
    .curve-eval { fill: none; stroke: #e5a97e; stroke-width: 1.8; stroke-dasharray: 5 4; }
    .curve-dot { fill: #dff4e8; stroke: #1f4f3e; stroke-width: 2; }
    .curve-foot { display: flex; justify-content: space-between; gap: 12px; color: #9fb2a7; font-size: 9px; }
    .artifact-mini {
      margin: 0; padding: 18px; min-height: 250px; display: flex; flex-direction: column; justify-content: center;
      color: #dbe9df; background: var(--log);
    }
    .artifact-mini-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid #334039; color: #91a69a; font-family: var(--mono); font-size: 9px; letter-spacing: .1em; }
    .artifact-mini-head strong { color: #eef6f0; font-size: 28px; font-weight: 500; letter-spacing: -.04em; }
    .artifact-mini-row { display: grid; grid-template-columns: 55px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 15px 0; border-bottom: 1px solid #334039; font-family: var(--mono); font-size: 9px; }
    .artifact-mini-row span { color: #91a69a; }
    .artifact-mini-row b { color: #fff; font-size: 17px; font-weight: 500; }
    .artifact-mini-row small { color: #91a69a; }
    .artifact-mini-foot { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; color: #a1c8ae; font-size: 9px; }
    .evidence-side { padding: 22px 22px 21px; }
    .side-kicker { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .side-kicker span { color: var(--copper-deep); font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .side-main {
      margin-top: 17px; padding: 17px 16px; background: var(--surface-strong); border: 1px solid var(--line);
    }
    .side-main strong { display: block; font-family: var(--display); font-size: 21px; line-height: 1.25; letter-spacing: -.02em; }
    .side-main p { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .side-main .button { width: 100%; margin-top: 15px; }
    .side-divider { height: 1px; background: var(--line); margin: 20px 0 16px; }
    .fact-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 13px; }
    .fact-list li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; font-size: 10px; }
    .fact-list dt, .fact-list .fact-key { color: var(--muted); }
    .fact-list .fact-value { min-width: 0; color: var(--ink-soft); overflow-wrap: anywhere; }
    .fact-list .fact-value strong { font-weight: 600; }
    .queue { margin-top: 20px; }
    .queue-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .input, .select {
      min-height: 42px; border: 1px solid var(--line-strong); border-radius: 2px;
      color: var(--ink); background: var(--surface-strong); padding: 0 11px;
    }
    .input::placeholder { color: #59695f; }
    .table-wrap { overflow-x: auto; }
    .job-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 11px; }
    .job-table th {
      padding: 11px 18px; color: var(--muted); background: rgba(236,230,217,.55);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      font-weight: 550; white-space: nowrap;
    }
    .job-table td { padding: 15px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .job-table tr:last-child td { border-bottom: 0; }
    .job-table tbody tr { transition: background .16s ease; }
    .job-table tbody tr:hover { background: rgba(255,255,255,.55); }
    .job-title { display: block; color: var(--ink); font-weight: 600; font-size: 12px; }
    .job-id { display: block; margin-top: 4px; color: var(--faint); font-family: var(--mono); font-size: 9px; }
    .job-action { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--forest); font-size: 11px; padding: 0 4px; }
    .job-action:hover { text-decoration: underline; }
    .empty, .loading {
      min-height: 420px; display: grid; place-content: center; text-align: center;
      padding: 52px 22px;
    }
    .empty-mark, .loading-mark {
      width: 56px; height: 56px; margin: 0 auto 18px; display: grid; place-items: center;
      border: 1px solid var(--line-strong); color: var(--forest); background: var(--surface-strong);
    }
    .empty h2, .loading h2 { margin: 0; font-family: var(--display); font-size: 26px; letter-spacing: -.02em; }
    .empty p, .loading p { max-width: 460px; margin: 10px auto 0; color: var(--muted); font-size: 12px; }
    .empty .button { margin-top: 18px; }
    .empty-path { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .empty-path span:nth-child(even) { color: var(--line-strong); }
    .skeleton { background: linear-gradient(90deg, rgba(216,209,194,.34), rgba(255,255,255,.78), rgba(216,209,194,.34)); background-size: 220% 100%; animation: shimmer 1.8s infinite; }
    @keyframes shimmer { to { background-position: -220% 0; } }
    .loading-lines { width: min(660px, 80vw); margin: 28px auto 0; display: grid; gap: 10px; }
    .loading-lines span { height: 13px; display: block; }
    .error-board { border-color: #d3aaa4; background: #fff7f2; }
    .error-board .section-head { border-bottom: 1px solid #e7cbc4; }
    .error-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); }
    .error-copy { padding: 24px; border-right: 1px solid #e7cbc4; }
    .error-code { color: var(--danger); font-family: var(--mono); font-size: 10px; letter-spacing: .08em; }
    .error-copy h2 { margin: 8px 0 10px; font-family: var(--display); font-size: 28px; }
    .error-copy p { margin: 0; max-width: 620px; color: var(--ink-soft); font-size: 12px; line-height: 1.8; }
    .diff-list { margin: 19px 0 0; display: grid; gap: 8px; }
    .diff-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 12px; padding: 10px 12px; background: rgba(255,255,255,.7); border: 1px solid #e2cfca; font-size: 10px; }
    .diff-row.head { color: var(--muted); font-weight: 600; background: transparent; border-color: transparent; padding-top: 0; }
    .diff-row code { color: var(--danger); }
    .error-next { padding: 24px; }
    .error-next h3 { margin: 0 0 12px; font-size: 13px; }
    .error-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .error-steps li { padding: 14px 0; border-top: 1px solid #e7cbc4; display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 11px; }
    .error-steps b { width: 21px; height: 21px; display: grid; place-items: center; border: 1px solid #d3aaa4; color: var(--danger); font-family: var(--mono); font-size: 9px; font-weight: 500; }
    .error-steps span { color: var(--muted); display: block; margin-top: 2px; }
    .wizard-shell { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, .6fr); gap: 24px; align-items: start; }
    .wizard-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); background: rgba(251,248,240,.7); }
    .wizard-step { min-height: 64px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); display: flex; align-items: center; gap: 9px; padding: 0 13px; text-align: left; font-size: 10px; }
    .wizard-step:last-child { border-right: 0; }
    .wizard-step b { font-family: var(--mono); font-size: 9px; color: var(--faint); }
    .wizard-step.active { background: var(--surface-strong); color: var(--ink); box-shadow: inset 0 -2px 0 var(--copper); }
    .wizard-step.active b { color: var(--copper); }
    .wizard-step.done b { color: var(--success); }
    .wizard-main { border: 1px solid var(--line); background: var(--surface); margin-top: 14px; min-height: 540px; display: flex; flex-direction: column; }
    .wizard-body { padding: 27px 29px 24px; flex: 1; }
    .wizard-kicker { color: var(--copper-deep); font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .wizard-body h2 { margin: 7px 0 7px; font-family: var(--display); font-size: 30px; letter-spacing: -.025em; }
    .wizard-body > p { margin: 0 0 24px; color: var(--muted); font-size: 12px; }
    .field { display: grid; gap: 7px; margin-bottom: 17px; }
    .field label { font-size: 11px; font-weight: 600; }
    .field small { color: var(--muted); font-size: 10px; }
    .input.wide { width: 100%; min-height: 46px; }
    .choice-grid { display: grid; gap: 10px; }
    .choice-card {
      display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px;
      align-items: start; padding: 16px; border: 1px solid var(--line); background: var(--surface-strong);
    }
    .choice-card.selected { border-color: var(--forest); box-shadow: inset 3px 0 0 var(--forest); }
    .choice-radio { width: 17px; height: 17px; border: 1px solid var(--line-strong); border-radius: 50%; margin-top: 2px; display: grid; place-items: center; }
    .choice-card.selected .choice-radio::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--forest); }
    .choice-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 600; }

          </section>
          <aside class="serving-side">
            <section class="side-panel identity-card"><div class="side-panel-head"><h3>本次验收对象</h3><span class="tag" style="color:#d8e5dc;border-color:#688175">BEST</span></div><div class="side-panel-body"><ul class="fact-list"><li><span class="fact-key">Adapter</span><span class="fact-value mono">adapter-best-01</span></li><li><span class="fact-key">来源</span><span class="fact-value mono">Attempt #7 · step 80</span></li><li><span class="fact-key">基座</span><span class="fact-value mono">Qwen3-0.6B-20261102-r1</span></li><li><span class="fact-key">实例</span><span class="fact-value mono">u-4090-11-c2a1</span></li><li><span class="fact-key">回收</span><span class="fact-value">空闲 15 分钟或手动结束</span></li></ul></div></section>
            <section class="side-panel"><div class="side-panel-head"><h3>验收清单</h3><span class="tag warn">3 / 4</span></div><div class="side-panel-body"><ul class="gate-list"><li><b>✓</b><span>服务健康检查通过<small>ready · vLLM 端口响应</small></span></li><li><b>✓</b><span>基座与 Adapter 指纹配对<small>20261102-r1 · best-fingerprint</small></span></li><li><b>✓</b><span>训练实例已释放<small>GPU 门禁已在 11:09 打开</small></span></li><li class="warn"><b>4</b><span>完成至少 3 个固定问题<small>当前 0 / 3，完成后才能判定验收</small></span></li></ul></div></section>
            <section class="side-panel"><div class="side-panel-head"><h3>安全结束</h3><span class="status running">计费中</span></div><div class="side-panel-body"><p class="inline-note">结束试用会停止 vLLM、删除独立实例并确认租约释放。会话记录不会被写入正式数据。</p><button class="button danger small" type="button" data-action="stop-inference" style="width:100%;margin-top:11px">${icon('stop')}结束试用并回收实例</button></div></section>
          </aside>
        </div>`;
    }
    function render() {
      const view = state.view === 'overview' ? overview() : state.view === 'create' ? createView() : state.view === 'detail' ? detail() : servingView();
      document.getElementById('app').innerHTML = `<div>${topbar()}<main class="page">${view}<footer class="footer"><span>ModelForge · 个人本机工作台 · 原型不连接训练 API</span><span>当前组合：Qwen3-0.6B · RTX 4090 · 固定运行时 · 基线 partial</span></footer></main></div>`;
      const label = document.getElementById('state-label');
      if (label) label.textContent = scenarioLabels[state.scenario];
      document.querySelectorAll('#state-menu button').forEach(button => button.setAttribute('aria-current', String(button.dataset.scenario === state.scenario)));
      const menu = document.getElementById('state-menu');
      if (menu) menu.classList.toggle('open', state.menuOpen);
      const toggle = document.getElementById('state-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', String(state.menuOpen));
      if (state.detailTab === 'logs' && state.view === 'detail') {
        const input = document.getElementById('log-search');
        input?.addEventListener('input', (event) => { state.logQuery = event.target.value; render(); document.getElementById('log-search')?.focus(); });
        const level = document.getElementById('log-level');
        level?.addEventListener('change', (event) => { state.logLevel = event.target.value; render(); });
      }
      const chat = document.getElementById('chat-input');
      chat?.addEventListener('input', (event) => { state.chatDraft = event.target.value; });
      if (state.chatDraft) chat.value = state.chatDraft;
      const taskName = document.getElementById('task-name');
      taskName?.addEventListener('input', (event) => { state.taskName = event.target.value; });
    }
    function openDialog(type) {
      const dialog = document.getElementById('action-dialog');
      let content = '';
      if (type === 'cancel') {
        content = `<div class="dialog-head"><small>DANGER / CONTROLLED STOP</small><h2>请求取消这次训练？</h2></div><div class="dialog-body"><p>请求取消不等于训练已停止。平台会依次等待远程进程退出、停止并删除实例、确认租约释放。</p><div class="dialog-note">当前 step 80。取消不会发布部分 Adapter；已产生日志和指标仍会保留。</div></div><div class="dialog-actions"><button class="button secondary" type="button" data-action="close-dialog">继续训练</button><button class="button danger" type="button" data-action="confirm-cancel">请求取消</button></div>`;
      } else if (type === 'submit') {
        content = `<div class="dialog-head"><small>MANUAL COMPUTE / ACKNOWLEDGE</small><h2>创建任务与冻结输入？</h2></div><div class="dialog-body"><p>平台将创建新的 Task 和 Attempt，并固定数据版本、基座指纹、参数与实例要求。不会购买、创建或预留 GPU。</p><div class="dialog-note">提交后进入 waiting_instance。你需要在优云手动创建实例，再返回绑定实例 ID。</div></div><div class="dialog-actions"><button class="button secondary" type="button" data-action="close-dialog">再检查一下</button><button class="button" type="button" data-action="confirm-submit">创建并冻结</button></div>`;
      } else if (type === 'bind') {
        content = `<div class="dialog-head"><small>MANUAL INSTANCE / BIND</small><h2>绑定手动创建的训练实例</h2></div><div class="dialog-body"><p>确认实例已 Running，且镜像、GPU 与可用区符合冻结要求。绑定后先执行运行时预检，通过后才启动训练。</p><div class="dialog-field"><label for="bind-instance">实例 ID</label><input class="input" id="bind-instance" placeholder="例如：u-4090-02-7fca"></div><label class="dialog-check"><input type="checkbox" id="bind-ack">我拥有此实例，并授权平台在训练成功、失败或取消后停止并删除。</label><div class="dialog-note">平台不会代为购买实例。原型不会调用真实云接口。</div></div><div class="dialog-actions"><button class="button secondary" type="button" data-action="close-dialog">取消</button><button class="button" type="button" data-action="confirm-bind">核验并绑定</button></div>`;
      } else {
        content = `<div class="dialog-head"><small>RESOURCE CLEANUP</small><h2>结束 Infer #fdb5a28c？</h2></div><div class="dialog-body"><p>停止生成服务、删除独立推理实例，并确认 GPU 租约释放。页面会话会立即失效，但本次验收证据仍可查看。</p><div class="dialog-note">此动作可能影响正在生成的回答。确认后不提供“恢复同一实例”操作。</div></div><div class="dialog-actions"><button class="button secondary" type="button" data-action="close-dialog">保持运行</button><button class="button danger" type="button" data-action="confirm-stop-inference">结束并回收</button></div>`;
      }
      dialog.innerHTML = content;
      dialog.showModal();
    }
    function closeDialog() { document.getElementById('action-dialog')?.close(); }
    async function sendChat(text) {
      if (!text.trim() || state.sending) return;
      state.chat = [...state.chat, { role: 'user', content: text.trim() }, { role: 'assistant', content: '' }];
      state.sending = true;
      state.chatDraft = '';
      render();
      const full = '判断：退款申请（超过七天）。\n\n下一步：先确认订单状态和商品是否已签收，再告知用户需要人工审核退款资格；不要直接承诺退款或补偿。建议回复：“我理解您想尽快处理退款。已超过七天，我先为您核对订单与签收状态，随后转交售后专员审核，请在 24 小时内留意处理结果。”';
      let cursor = 0;
      await new Promise(resolve => {
        const timer = setInterval(() => {
          cursor += Math.max(2, Math.ceil(full.length / 26));
          state.chat[state.chat.length - 1].content = full.slice(0, cursor);
          const stream = document.getElementById('chat-stream');
          if (stream) {
            const last = stream.querySelector('.message.assistant:last-child p');
            if (last) last.textContent = state.chat[state.chat.length - 1].content;
          }
          if (cursor >= full.length) {
            clearInterval(timer);
            state.sending = false;
            render();
            resolve();
          }
        }, 55);
      });
    }
    document.addEventListener('click', (event) => {
      const nav = event.target.closest('[data-nav]');
      if (nav) {
        const key = nav.dataset.nav;
        if (key === 'training') setView('overview');
        else if (key === 'serving') setView('serving');
        else toast('原型仅覆盖本轮「推理训练」范围；其他模块保持现状。');
        return;
      }
      const prompt = event.target.closest('[data-prompt]');
      if (prompt) { void sendChat(prompt.dataset.prompt); return; }
      const actionNode = event.target.closest('[data-action]');
      if (!actionNode) return;
      const action = actionNode.dataset.action;
      if (action === 'refresh') { toast('已刷新训练事实：没有覆盖最后成功快照。'); return; }
      if (action === 'new-training') { state.wizardStep = 1; setView('create'); return; }
      if (action === 'bind-instance') { openDialog('bind'); return; }
      if (action === 'back-overview') { setView('overview'); return; }
      if (action === 'open-detail') { setView('detail', { tab: 'overview' }); return; }
      if (action === 'open-detail-logs') { setView('detail', { tab: 'logs' }); return; }
      if (action === 'open-detail-analysis') { setView('detail', { tab: 'analysis' }); return; }
      if (action === 'open-artifacts') { state.scenario = 'success'; state.detailTab = 'artifacts'; setView('detail'); return; }
      if (action === 'open-serving') { state.scenario = 'success'; state.view = 'serving'; updateUrl(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if (action === 'back-detail') { setView('detail', { tab: 'artifacts' }); return; }
      if (action === 'detail-tab') { state.detailTab = actionNode.dataset.tab; updateUrl(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if (action === 'wizard-next') {
        if (state.wizardStep === 1) {
          const name = document.getElementById('task-name')?.value.trim();
          state.taskName = name || '';
          if (!name) {
            state.formError = '请先为本次训练命名。';
            render();
            setTimeout(() => document.getElementById('form-error')?.focus(), 20);
            return;
          }
          state.formError = '';
        }
        state.wizardStep = Math.min(4, state.wizardStep + 1);
        render(); window.scrollTo({top:0,behavior:'smooth'}); return;
      }
      if (action === 'wizard-back') { state.wizardStep = Math.max(1, state.wizardStep - 1); render(); return; }
      if (action === 'wizard-jump') { state.wizardStep = Number(actionNode.dataset.step); render(); return; }
      if (action === 'wizard-submit') { openDialog('submit'); return; }
      if (action === 'request-cancel') { openDialog('cancel'); return; }
      if (action === 'confirm-cancel') { closeDialog(); state.scenario = 'loading'; render(); setTimeout(() => { state.scenario = 'error'; render(); toast('取消请求已记录，等待进程退出与资源回收确认。'); }, 1200); return; }
      if (action === 'confirm-submit') { closeDialog(); const button = document.querySelector('[data-action="wizard-submit"]'); if (button) button.disabled = true; state.scenario = 'loading'; updateUrl(); render(); toast('正在冻结输入并创建 Attempt…'); setTimeout(() => { state.submitted = true; state.wizardStep = 1; state.scenario = 'waiting'; setView('overview'); toast('任务已冻结，进入等待手动实例；平台没有购买 GPU。'); }, 1200); return; }
      if (action === 'confirm-bind') {
        const id = document.getElementById('bind-instance')?.value.trim();
        const ack = document.getElementById('bind-ack')?.checked;
        if (!id || !ack) {
          toast('请填写实例 ID，并确认清理授权。');
          return;
        }
        closeDialog();
        state.scenario = 'loading';
        updateUrl();
        render();
        toast('正在核验实例与运行时…');
        setTimeout(() => { state.scenario = 'running'; updateUrl(); render(); toast('运行时检查通过，训练已启动。'); }, 1000);
        return;
      }
      if (action === 'back-overview') { setView('overview'); return; }
      if (action === 'close-dialog') { closeDialog(); return; }
      if (action === 'open-stage') { const stage = Number(actionNode.dataset.stage); if (stage === 4) { state.scenario = 'success'; } setView('detail', { tab: stage === 4 ? 'artifacts' : stage === 3 ? 'logs' : 'overview' }); return; }
      if (action === 'download-artifact') { toast('原型：Adapter 包校验通过，下载不会连接 MinIO。'); return; }
      if (action === 'copy-manifest') { navigator.clipboard?.writeText('客服意图训练集 v3 · Qwen3-0.6B · split-4f82b9d1').catch(() => {}); toast('完整冻结快照已复制。'); return; }
      if (action === 'download-logs') { toast('原型：日志下载已模拟，没有读取远程文件。'); return; }
      if (action === 'new-attempt') { toast('已保留同一冻结输入；原型不创建真实 Attempt。'); return; }
      if (action === 'stop-inference') { openDialog('stop'); return; }
      if (action === 'confirm-stop-inference') { closeDialog(); toast('结束指令已记录：等待服务停止、实例删除和租约释放确认。'); return; }
      if (action === 'retry-inference') { state.scenario = 'loading'; render(); setTimeout(() => { state.scenario = 'running'; render(); toast('实例未通过健康检查，当前仍是 blocked；请查看日志。'); }, 800); return; }
      if (action === 'send-chat') { const value = document.getElementById('chat-input')?.value || state.chatDraft || ''; void sendChat(value); return; }
    });
    document.getElementById('state-toggle').addEventListener('click', () => { state.menuOpen = !state.menuOpen; render(); });
    document.querySelectorAll('#state-menu button').forEach(button => button.addEventListener('click', () => setScenario(button.dataset.scenario)));
    render();
  </script>
