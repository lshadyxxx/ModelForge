      </footer>
    </section>
  </div>

  <script src="shared/prototype-data.js"></script>
  <script src="shared/prototype-core.js"></script>
  <script>
    (() => {
      const data = window.MF_PROTOTYPE;
      const ui = window.MFUI;
      const root = document.getElementById("viewRoot");
      const attemptSelect = document.getElementById("attemptSelect");
      const applyDialogRoot = document.getElementById("applyDialog");
      const applyDialogBody = document.getElementById("applyDialogBody");
      const confirmApply = document.getElementById("confirmApply");
      const reportRailNav = document.getElementById("reportRailNav");
      const applyDialog = ui.initDialog(applyDialogRoot);
      const params = new URLSearchParams(location.search);
      let attempt = data.getAttempt(params.get("attempt") || data.defaults.attempt);
      let requestedView = params.get("view");
      let view = ["report", "empty"].includes(requestedView) ? requestedView : "entry";
      let filter = "all";
      let selectedEvidence = "E-01";
      let generationTimer = 0;
      let currentExperiment = null;
      let limitedGenerated = false;

      function syncReportChrome() {
        if (reportRailNav) reportRailNav.hidden = view !== "report";
      }

      attemptSelect.innerHTML = data.attempts.map((item) => {
        const suffix = item.state === "succeeded"
          ? "已成功"
          : item.state === "failed"
            ? "已失败"
            : "已取消";
        return `<option value="${ui.escapeHtml(item.id)}">${ui.escapeHtml(item.displayName)} · ${suffix}</option>`;
      }).join("");
      attemptSelect.value = attempt.id;

      function evidenceFor(attemptData, evidenceId) {
        return attemptData.report?.evidence?.find((item) => item.id === evidenceId)
          || (attemptData.report?.evidence || [])[0]
          || null;
      }

      function severityClass(tone) {
        return {blocked: "danger", attention: "warning", passed: "success", info: "neutral", unknown: "unknown"}[tone] || "neutral";
      }

      function renderEntry() {
        const hasReport = attempt.report?.exists;
        const isFailed = attempt.state === "failed";
        const isCancelled = attempt.state === "cancelled";
        const statusText = isFailed
          ? "运行已失败，保留错误码与缺失证据矩阵；没有生成训练指标。"
          : isCancelled
            ? "运行已取消，未发布部分 Adapter；当前没有完整 AI 报告。"
            : "训练和实例回收已结束；Adapter 可用性仍需独立核对。";
        const title = isFailed
          ? "失败复盘：这次运行没有走到训练"
          : isCancelled
            ? "报告尚未生成：当前 Attempt 缺少训练指标"
            : "训练内信号可读，但模型可用性尚未验证";
        const summary = isFailed
          ? "安全首启阶段终止；metrics、runtime 与执行清单均未形成，当前不能确认根因。"
          : isCancelled
            ? "当前有 Attempt 快照、runtime 与 6 个执行文件，但没有 metrics、Adapter 或推理验收。"
            : "22 个 Train Loss / LR 采样、1 个 Eval 点、12 个证据文件和 Best / Final 2/2 可用；独立推理验收未关联。";
        const reportBadge = hasReport
          ? `<span class="mf-status ${isFailed ? "danger" : "warning"}">${isFailed ? "失败复盘已生成" : "可用性未验证"}</span>`
          : `<span class="mf-status neutral">无报告</span>`;

        root.innerHTML = `
          <div class="view">
            <div class="detail-heading">
              <div>
                <div class="mf-eyebrow">RUN DETAIL / ATTEMPT #${attempt.number} / ${ui.escapeHtml(attempt.mode)}</div>
                <h1>${ui.escapeHtml(attempt.name)}</h1>
                <div class="meta">
                  <span class="mf-mono">${ui.escapeHtml(attempt.id)}</span>
                  <span>${ui.escapeHtml(attempt.model)} · ${ui.escapeHtml(attempt.method)}</span>
                  <span>更新于 ${ui.escapeHtml(attempt.updatedAt)}</span>
                </div>
              </div>
              <div class="detail-actions">
                <span class="mf-status ${isFailed ? "danger" : isCancelled ? "neutral" : "success"}">${ui.escapeHtml(attempt.stateLabel)}</span>
                <button class="mf-button" type="button" id="refreshEntry">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
                  刷新
                </button>
                <button class="mf-button" type="button">${isFailed ? "创建重试 Attempt" : "查看运行产物"}</button>
              </div>
            </div>

            <nav class="detail-tabs" aria-label="运行详情页签">
              <button type="button" aria-current="page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 18l6-6 4 3 6-10"/></svg>
                运行总览
              </button>
              <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.5" fill="currentColor"/><circle cx="15" cy="12" r="1.5" fill="currentColor"/><circle cx="10" cy="18" r="1.5" fill="currentColor"/></svg>运行分析</button>
              <button type="button" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3Z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></svg>智能报告</button>
              <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>训练日志</button>
              <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>训练产物</button>
              <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>冻结输入</button>
            </nav>

            <div class="status-band ${isFailed ? "failure" : ""}">
              <span class="mark" aria-hidden="true"></span>
              <strong>${ui.escapeHtml(attempt.stateLabel)}</strong>
              <span>${statusText}</span>
              <span class="boundary">${isFailed ? "失败状态 ≠ 根因已确认" : "训练成功 ≠ Adapter 可用 ≠ 模型可用"}</span>
            </div>

            <section class="entry-hero" aria-labelledby="entryTitle">
              <div class="entry-copy">
                <div class="entry-kicker">
                  <span class="mf-eyebrow">AI RUN DIAGNOSIS · ADVISORY</span>
                  ${reportBadge}
                  ${hasReport ? `<span class="mf-status neutral">${ui.escapeHtml(attempt.report.generatedAt)} 生成</span>` : ""}
                </div>
                <h2 id="entryTitle">${ui.escapeHtml(title)}</h2>
                <p>${ui.escapeHtml(summary)}</p>
                <div class="entry-badges">
                  ${renderEntryBadges()}
                </div>
                <div class="entry-actions">
                  <button class="mf-button primary" type="button" data-action="${hasReport ? "open-report" : "generate-report"}">
                    ${hasReport ? "查看完整诊断" : "生成有限报告"}
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
                  </button>
                  <button class="mf-button" type="button">查看原始运行分析</button>
                  ${hasReport ? `<button class="mf-button quiet" type="button" data-action="regenerate">重新生成</button>` : ""}
                </div>
              </div>
              <aside class="entry-side" aria-label="证据覆盖">
                <h3>Evidence coverage</h3>
                ${renderCoverageSummary()}
              </aside>
            </section>

            <div class="overview-grid">
              <section class="overview-card">
                <div class="card-head">
                  <div><span class="mf-eyebrow">LATEST SAMPLES</span><h2>运行事实与真实指标</h2></div>
                  <span class="mf-status neutral">只展示接口事实</span>
                </div>
                <div class="overview-metrics">
                  <div><span>最新 Step</span><strong>${attempt.metrics.trainCount ? "22" : "—"}</strong><small>${attempt.metrics.trainCount ? "Epoch 1.00" : "指标未形成"}</small></div>
                  <div><span>Train Loss</span><strong>${attempt.metrics.lastTrain === null ? "—" : attempt.metrics.lastTrain}</strong><small>${attempt.metrics.trainCount} 个真实采样</small></div>
                  <div><span>Eval Loss</span><strong>${attempt.metrics.bestEval === null ? "—" : attempt.metrics.bestEval}</strong><small>${attempt.metrics.evalCount ? "仅 step 22 一点" : "验证点未形成"}</small></div>
                  <div><span>显存峰值</span><strong>${attempt.memory ? attempt.memory.peakGiB + " GiB" : "—"}</strong><small>${attempt.memory ? attempt.memory.samples + " 次采样" : "未上报"}</small></div>
                </div>
                <div class="lifecycle" aria-label="托管生命周期">
                  <span>创建实例</span><span>费用守卫</span><span>首启与运行时</span><span>训练</span><span>产物同步</span><span>回收</span>
                </div>
              </section>
              <aside class="overview-card">
                <div class="card-head">
                  <div><span class="mf-eyebrow">RUN FACTS</span><h2>冻结输入</h2></div>
                  <button class="mf-button quiet" type="button">查看全部</button>
                </div>
                <dl class="fact-list">
                  <div><dt>数据集</dt><dd class="mf-mono">${ui.escapeHtml(attempt.dataset.shortId)} · ${attempt.dataset.samples} 条</dd></div>
                  <div><dt>基座</dt><dd class="mf-mono">${ui.escapeHtml(attempt.base.shortId)} · ${ui.escapeHtml(attempt.model)}</dd></div>
                  <div><dt>运行配置</dt><dd>${attempt.config.epochs} epoch · LR ${attempt.config.learning_rate} · LoRA r${attempt.config.lora_rank}</dd></div>
                  <div><dt>GPU / 镜像</dt><dd>${ui.escapeHtml(attempt.gpu)} · ${ui.escapeHtml(attempt.image)}</dd></div>
                  <div><dt>Adapter</dt><dd>${attempt.adapters.length ? "Best / Final 2/2 available" : "未发布"}</dd></div>
                </dl>
              </aside>
            </div>
          </div>
        `;
      }

      function renderEntryBadges() {
        if (attempt.state === "succeeded") {
          return `
            <span><b>训练健康度</b> 部分可判断</span>
            <span><b>Adapter</b> 2/2 available</span>
            <span><b>推理验收</b> 未关联</span>
          `;
        }
        if (attempt.state === "failed") {
          return `
            <span><b>失败阶段</b> 安全首启</span>
            <span><b>Metrics</b> 0</span>
            <span><b>Adapter</b> 未生成</span>
          `;
        }
        return `
          <span><b>运行结果</b> 已取消</span>
          <span><b>Metrics</b> 0</span>
          <span><b>部分产物</b> 禁止发布</span>
        `;
      }

      function renderCoverageSummary() {
        if (attempt.state === "succeeded") {
          return `
            <div class="coverage-number"><strong>8</strong><span>/ 11 类证据可用</span></div>
            <div class="coverage-bar"><span></span></div>
            <div class="coverage-list">
              <div><span>指标 / runtime / manifest</span><strong>有</strong></div>
              <div><span>Token / 显存 / 产物</span><strong>有</strong></div>
              <div><span>独立推理验收</span><strong>未关联</strong></div>
            </div>
            <p class="inspector-note">${ui.escapeHtml(attempt.report.sourceNote)}</p>
          `;
        }
        if (attempt.state === "failed") {
          return `
            <div class="coverage-number"><strong>3</strong><span>/ 11 类证据可用</span></div>
            <div class="coverage-bar"><span style="width:27%"></span></div>
            <div class="coverage-list">
              <div><span>Attempt / provisioning</span><strong>有</strong></div>
              <div><span>Metrics / runtime / manifest</span><strong>缺失</strong></div>
              <div><span>日志</span><strong>0 chunk</strong></div>
            </div>
            <p class="inspector-note">失败报告会先区分“已确认失败阶段”和“尚未确认根因”。</p>
          `;
        }
        return `
          <div class="coverage-number"><strong>3</strong><span>/ 8 类证据可用</span></div>
          <div class="coverage-bar"><span style="width:38%"></span></div>
          <div class="coverage-list">
            <div><span>Attempt snapshot</span><strong>有</strong></div>
            <div><span>Runtime / 6 files</span><strong>有</strong></div>
            <div><span>Metrics / Adapter</span><strong>缺失</strong></div>
          </div>
          <p class="inspector-note">没有完整指标时，AI 只能生成“有限复盘”，不能判断训练健康度。</p>
        `;
      }

      function renderLoading() {
        root.innerHTML = `
          <div class="view loading-view" role="status" aria-live="polite">
            <section class="loading-card">
              <div class="loading-mark">
                <span class="spinner" aria-hidden="true"></span>
                <span class="mf-eyebrow">GENERATING ADVISORY REPORT</span>
              </div>
              <h1>正在整理已归档证据</h1>
              <p>不会重新训练，也不会创建 GPU。报告只读取该 Attempt 的快照、指标、runtime、执行清单与 Adapter 状态。</p>
              <div class="loading-steps" aria-label="生成阶段">
                <div class="loading-step is-current" data-loading-step>读取冻结快照</div>
                <div class="loading-step" data-loading-step>核对指标与证据</div>
                <div class="loading-step" data-loading-step>归纳发现与限制</div>
                <div class="loading-step" data-loading-step>生成下一步实验</div>
              </div>
              <p class="inspector-note">原型示例：这里用本地定时器模拟等待状态，不调用任何生成模型。</p>
            </section>
          </div>
        `;
        const steps = [...root.querySelectorAll("[data-loading-step]")];
        steps.forEach((step, index) => {
          window.setTimeout(() => {
            steps.forEach((node) => node.classList.remove("is-current"));
            step.classList.add("is-current");
          }, 360 * index);
        });
      }

      function startGeneration() {
        if (generationTimer) window.clearTimeout(generationTimer);
        view = "loading";
        renderLoading();
        syncReportChrome();
        generationTimer = window.setTimeout(() => {
          if (attempt.report?.exists) {
            view = "report";
            selectedEvidence = attempt.state === "failed" ? "E-F1" : "E-01";
            render();
            ui.toast("报告已重新生成；旧版本仍代表同一 Attempt 的已归档证据。");
          } else {
            view = "limited";
            limitedGenerated = true;
            render();
          }
        }, 1650);
      }

      function renderReport() {
        if (!attempt.report?.exists) {
          renderEmpty();
          return;
        }
        const report = attempt.report;
        const evidence = evidenceFor(attempt, selectedEvidence);
        root.innerHTML = `
          <div class="view report-shell">
            <div class="report-heading">
              <div>
                <div class="report-title-line">
                  <span class="mf-eyebrow">AI RUN DIAGNOSIS / ADVISORY</span>
                  <span class="mf-demo-stamp">原型示例</span>
                  <span class="mf-status ${attempt.state === "failed" ? "danger" : "warning"}">${attempt.state === "failed" ? "失败复盘" : "可用性未验证"}</span>
                </div>
                <h1>${ui.escapeHtml(report.headline)}</h1>
                <p>${ui.escapeHtml(report.summary)}</p>
                <div class="report-meta">
                  <span>版本 <b class="mf-mono">${ui.escapeHtml(report.version)}</b></span>
                  <span>生成于 ${ui.escapeHtml(report.generatedAt)}</span>
                  <span>证据截至 ${ui.escapeHtml(attempt.updatedAt)}</span>
                  <span>只读快照 · 不写回 Attempt</span>
                  <span>${ui.escapeHtml(attempt.displayName)}</span>
                  <span>${ui.escapeHtml(attempt.mode)} · ${ui.escapeHtml(attempt.method)}</span>
                </div>
              </div>
              <div class="report-actions">
                <button class="mf-button quiet" type="button" data-action="back-entry">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M19 12H5M10 7l-5 5 5 5"/></svg>
                  返回详情
                </button>
                <button class="mf-button" type="button" data-action="regenerate">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
                  重新生成
                </button>
                <button class="mf-button primary" type="button" data-action="copy-report">复制报告摘要</button>
              </div>
            </div>

            <nav class="report-jump" aria-label="报告章节">
              <a href="#report-summary">结论</a>
              <a href="#report-findings">关键发现</a>
              <a href="#report-evidence">证据</a>
              <a href="#chart-observed">趋势</a>
              <a href="#report-experiments">下一步</a>
            </nav>

            <div class="verdict-grid" id="report-summary">
              ${renderVerdictCard("健康度", report.health, "")}
              ${renderVerdictCard("可交付性", report.delivery, "delivery")}
            </div>

            <div class="summary-grid">
              <section class="summary-lead">
                <span class="mf-eyebrow">REPORT POSITION</span>
                <h2>${attempt.state === "failed" ? "先确认失败阶段与证据缺口，不把缺失当根因。" : "训练内信号与业务可用性，必须分开回答。"}</h2>
                <p>${ui.escapeHtml(report.sourceNote)}</p>
                <p><strong>硬门禁仍由原系统负责：</strong>Attempt 状态、Adapter available、runtime lock、Adapters 存储校验和独立推理验收，都不会被 AI 报告覆盖。</p>
                ${renderNextAction(report)}
              </section>
              <section class="summary-answers" aria-label="四个问题摘要">
                ${report.answers.map((answer) => `
                  <article class="summary-answer">
                    <span>${ui.escapeHtml(answer.label)}</span>
                    <strong>${ui.escapeHtml(answer.verdict)}</strong>
                    <p>${ui.escapeHtml(answer.text)}</p>
                  </article>
                `).join("")}
              </section>
            </div>

            <div class="diagnosis-layout">
              <section class="findings-panel" id="report-findings" aria-labelledby="findingsTitle">
                <div class="findings-toolbar">
                  <div>
                    <span class="mf-eyebrow">FINDING LEDGER</span>
                    <h2 id="findingsTitle">关键发现</h2>
                  </div>
                  ${renderFilters(report.findings)}
                </div>
                <div class="findings-live" id="findingsLive" aria-live="polite">${filterDescription(report.findings)}</div>
                <div id="findingList">${renderFindings(report.findings)}</div>
              </section>

              <aside class="inspector" id="report-evidence" aria-labelledby="inspectorTitle">
                <div class="inspector-head">
                  <span class="mf-eyebrow">EVIDENCE INSPECTOR</span>
                  <h2 id="inspectorTitle">原始证据</h2>
                </div>
                <div class="inspector-body" id="inspectorBody">
                  ${evidence ? renderInspector(evidence) : renderInspectorEmpty()}
                </div>
              </aside>
            </div>

            ${attempt.state === "succeeded" ? renderCharts() : renderNoChart()}

            <section class="experiment-panel" id="report-experiments" aria-labelledby="experimentsTitle">
              <div class="experiment-head">
                <div>
                  <span class="mf-eyebrow">NEXT EXPERIMENTS</span>
                  <h2 id="experimentsTitle">下一步实验</h2>
                  <p>建议不自动执行；先验证假设，再决定是否修改训练配置。</p>
                </div>
                <span class="mf-status neutral">只生成草稿</span>
              </div>
              <div class="experiment-list">
                ${report.experiments.map(renderExperiment).join("")}
              </div>
            </section>

            <section class="limit-card" id="report-limits" style="margin-top:14px">
              <span class="mf-eyebrow">LIMITATIONS</span>
              <h2>这份报告不能回答什么</h2>
              <ul class="limit-list">
                ${report.limitations.map((item) => `<li>${ui.escapeHtml(item)}</li>`).join("")}
              </ul>
            </section>

            <section class="ask-box">
              <span class="mf-eyebrow">FOLLOW-UP · FRONTEND ONLY</span>
              <form id="askForm">
                <label class="mf-sr-only" for="askInput">追问报告证据</label>
                <input id="askInput" placeholder="例如：为什么不能根据 0.2148 判断模型可用？" autocomplete="off">
                <button class="mf-button" type="submit">追问原型</button>
              </form>
              <p class="ask-response" id="askResponse" hidden></p>
            </section>
          </div>
        `;
        ui.initAskBox(
          document.getElementById("askForm"),
          document.getElementById("askResponse"),
          {
            "为什么不能根据 0.2148 判断模型可用？": "观测：0.2148 只是一个 Eval Loss 点，并且没有推理验收。推断：它只能说明当前验证集的优化目标值，不能说明问答质量、事实性或服务可用。",
            "最应该先做什么？": "先完成独立推理验收。Adapter available 只说明两个文件可校验、可下载；没有推理请求与人工观察，不能进入“模型可用”结论。",
          },
        );
      }

      function renderNextAction(report) {
        if (attempt.state === "failed") {
          return `
            <div class="summary-next">
              <span>建议先做</span>
              <strong>先补齐失败阶段上下文，再决定是否重试</strong>
              <p>错误码只定位到安全首启；日志为 0 chunk，不能据此确认根因。</p>
              <button class="mf-button quiet" type="button" data-action="scroll-to" data-scroll-target="#report-findings">查看证据缺口</button>
            </div>
          `;
        }
        return `
          <div class="summary-next">
            <span>建议先做</span>
            <strong>先用 Best Adapter 完成独立推理验收</strong>
            <p>当前没有关联当前 Adapter 的推理 Trial；先验证服务与代表性问题，再考虑重复训练或调参。</p>
            <button class="mf-button quiet" type="button" data-action="scroll-to" data-scroll-target="#experiment-X-01">查看 P0 验收步骤</button>
          </div>
        `;
      }

      function renderVerdictCard(kind, value, extraClass) {
        const toneClass = value.tone === "blocked" ? "blocked" : "";
        const evidenceId = attempt.state === "failed" ? "E-F1" : "E-06";
        const healthTarget = attempt.state === "failed" ? "#report-findings" : "#chart-observed";
        const deliveryAction = attempt.state === "failed"
          ? `<button class="verdict-action" type="button" data-action="open-evidence" data-evidence-id="${evidenceId}">查看失败证据 <span aria-hidden="true">→</span></button>`
          : `<button class="verdict-action" type="button" data-action="open-evidence" data-evidence-id="${evidenceId}">查看 Adapter 证据 <span aria-hidden="true">→</span></button>`;
        return `
          <article class="verdict-card ${extraClass} ${toneClass}">
            <div class="verdict-top">
              <span>${kind === "健康度" ? "TRAINING HEALTH" : "DELIVERABILITY"}</span>
              <span class="mf-status ${value.tone === "blocked" ? "danger" : value.tone === "watch" ? "warning" : "unknown"}">${ui.escapeHtml(value.label)}</span>
            </div>
            <h2>${ui.escapeHtml(value.title)}</h2>
            <p>${ui.escapeHtml(value.detail)}</p>
            <div class="verdict-facts">
              ${kind === "健康度"
                ? `<span>Train ${attempt.metrics.trainCount} pts</span><span>Eval ${attempt.metrics.evalCount} pt</span><span>No hard fail</span>`
                : `<span>Best/Final ${attempt.adapters.length}/2</span><span>Inference ${ui.escapeHtml(attempt.inferenceAcceptance.label)}</span><span>${attempt.state === "failed" ? "artifact pending" : "artifact verified"}</span>`}
            </div>
            <div class="verdict-actions">
              ${kind === "健康度"
                ? `<button class="verdict-action" type="button" data-action="scroll-to" data-scroll-target="${healthTarget}">${attempt.state === "failed" ? "查看失败发现" : "查看图表依据"} <span aria-hidden="true">→</span></button>`
                : deliveryAction}
            </div>
          </article>
        `;
      }

      function renderFilters(findings) {
        const counts = {
          all: findings.length,
          blocked: findings.filter((item) => item.severity === "blocked").length,
          attention: findings.filter((item) => item.severity === "attention").length,
          passed: findings.filter((item) => item.severity === "passed").length,
          info: findings.filter((item) => item.severity === "info").length,
          unknown: findings.filter((item) => item.severity === "unknown").length,
        };
        const options = [
          ["all", "全部"],
          ["blocked", "阻断"],
          ["attention", "需关注"],
          ["passed", "已通过"],
          ["info", "提示"],
          ["unknown", "无法判断"],
        ];
        return `<div class="filter-row" role="group" aria-label="按严重度筛选">${options.map(([key, label]) => `
          <button type="button" class="mf-chip ${filter === key ? "is-active" : ""}" data-filter="${key}" aria-pressed="${filter === key}">
            ${label}<span class="count">${counts[key]}</span>
          </button>
        `).join("")}</div>`;
      }

      function filterDescription(findings) {
        const shown = filter === "all" ? findings.length : findings.filter((item) => item.severity === filter).length;
        return `当前显示 ${shown} 条发现；展开条目查看观测、推断、建议与证据，不只依赖颜色。`;
      }

      function renderFindings(findings) {
        const order = [
          ["blocked", "阻断"],
          ["attention", "需关注"],
          ["passed", "已通过"],
          ["info", "提示"],
          ["unknown", "无法判断"],
        ];
        const filteredGroups = order
          .filter(([key]) => filter === "all" || filter === key)
          .map(([key, label]) => {
            const rows = findings.filter((item) => item.severity === key);
            if (!rows.length) return "";
            return `
              <section class="finding-group" aria-label="${label}">
                <div class="finding-group-head">${label}<span class="mf-status ${severityClass(key)}">${rows.length}</span></div>
                ${rows.map(renderFinding).join("")}
              </section>
            `;
          }).join("");
        return filteredGroups || `<div class="empty-main" style="margin:16px"><h2>没有符合筛选的发现</h2><p>选择“全部”恢复全部证据。</p></div>`;
      }

      function renderFinding(item) {
        const open = filter !== "all"
          || item.severity === "attention"
          || attempt.report?.findings?.[0]?.id === item.id;
        return `
          <details class="finding" id="${ui.escapeHtml(item.id)}" ${open ? "open" : ""}>
            <summary>
              <div class="finding-headline">
                <div>
                  <div class="finding-id">${ui.escapeHtml(item.id)} · ${ui.escapeHtml(item.category)}</div>
                  <h3>${ui.escapeHtml(item.title)}</h3>
                </div>
                <span class="finding-state">
                  <span class="mf-status ${severityClass(item.severity)}">${ui.escapeHtml(item.severityLabel)}</span>
                  <span class="finding-chevron" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>
                  </span>
                </span>
              </div>
              <div class="finding-meta">
                <span class="mf-layer ${item.layer === "推断" ? "inference" : item.layer === "建议" ? "advice" : item.layer === "限制" ? "limit" : ""}">${ui.escapeHtml(item.layer)}</span>
                <span>${ui.escapeHtml(item.category)}</span>
                <span class="confidence">置信度 ${ui.escapeHtml(item.confidence)}</span>
              </div>
              <p class="finding-preview">${ui.escapeHtml(item.observation)}</p>
            </summary>
            <div class="finding-content">
              <dl class="finding-copy">
                <div><dt>观测</dt><dd>${ui.escapeHtml(item.observation)}</dd></div>
                <div><dt>推断</dt><dd>${ui.escapeHtml(item.inference)}</dd></div>
                <div><dt>建议</dt><dd>${ui.escapeHtml(item.recommendation)}</dd></div>
              </dl>
              <div class="finding-foot">
                <div class="evidence-row">
                  ${item.evidence.map((id) => `
                    <button type="button" class="mf-evidence-chip" data-evidence="${ui.escapeHtml(id)}" aria-pressed="${selectedEvidence === id}" title="展开证据 ${ui.escapeHtml(id)}">${ui.escapeHtml(id)}</button>
                  `).join("")}
                </div>
                <span class="confidence">点击证据 chip 查看原始字段</span>
              </div>
            </div>
          </details>
        `;
      }

      function renderInspector(item) {
        if (!item) return renderInspectorEmpty();
        return `
          <span class="evidence-tag">${ui.escapeHtml(item.id)} · ${ui.escapeHtml(item.kind)}</span>
          <h3 style="margin-top:10px;font-size:13px">${ui.escapeHtml(item.title)}</h3>
          <div class="inspector-value">${ui.escapeHtml(item.value)}</div>
          <p class="inspector-detail">${ui.escapeHtml(item.detail)}</p>
          <dl class="inspector-facts">
            <div><dt>来源</dt><dd>${ui.escapeHtml(item.source)}</dd></div>
            <div><dt>字段 / 文件</dt><dd class="mf-mono">${ui.escapeHtml(item.path)}</dd></div>
            <div><dt>样本</dt><dd>${ui.escapeHtml(item.samples)}</dd></div>
            ${item.hash ? `<div><dt>摘要</dt><dd class="mf-mono">${ui.escapeHtml(item.hash)}</dd></div>` : ""}
          </dl>
          <div class="inspector-note"><strong>限制：</strong>${ui.escapeHtml(item.limitation)}</div>
          <button type="button" class="mf-button quiet" style="margin-top:10px" data-action="copy-evidence" data-evidence-id="${ui.escapeHtml(item.id)}">复制证据说明</button>
          ${renderEvidenceIndex()}
        `;
      }

      function renderEvidenceIndex() {
        const evidenceRows = attempt.report?.evidence || [];
        if (!evidenceRows.length) return "";
        return `
          <div class="evidence-index" aria-label="证据索引">
            <div class="evidence-index-head"><span>Evidence index</span><span>${evidenceRows.length} 类</span></div>
            ${evidenceRows.map((item) => `
              <button type="button" class="${item.id === selectedEvidence ? "is-active" : ""}" data-evidence="${ui.escapeHtml(item.id)}" aria-pressed="${item.id === selectedEvidence}">
                <span class="id">${ui.escapeHtml(item.id)}</span>
                <span class="title">${ui.escapeHtml(item.title)}</span>
                <span class="kind">${ui.escapeHtml(item.kind)}</span>
              </button>
            `).join("")}
          </div>
        `;
      }

      function renderInspectorEmpty() {
        return `<p class="inspector-detail">选择任一 evidence chip 查看字段、文件路径、样本数、摘要与限制。</p>`;
      }

      function renderCharts() {
        const width = 780;
        const height = 230;
        const padding = {left: 44, right: 22, top: 18, bottom: 30};
        const max = Math.max(...attempt.trainLoss);
        const min = Math.min(...attempt.trainLoss);
        const lossPath = ui.linePath(attempt.trainLoss, width, height, padding, min, max);
        const baselineY = height - padding.bottom;
        const xFor = (index) => padding.left + (index / Math.max(attempt.trainLoss.length - 1, 1)) * (width - padding.left - padding.right);
        const yFor = (value) => padding.top + (1 - (value - min) / Math.max(max - min, 0.000001)) * (height - padding.top - padding.bottom);
        const evalX = xFor(attempt.trainLoss.length - 1);
        const evalY = yFor(attempt.metrics.bestEval);
        const lrWidth = 560;
        const lrHeight = 94;
        const lrMin = Math.min(...attempt.learningRate);
        const lrMax = Math.max(...attempt.learningRate);
        const lrPath = ui.linePath(attempt.learningRate, lrWidth, lrHeight, {left: 5, right: 5, top: 7, bottom: 8}, lrMin, lrMax);
        const tableRows = attempt.trainLoss.map((value, index) => `
          <tr><td>${index + 1}</td><td>${value.toFixed(4)}</td><td>${attempt.learningRate[index].toExponential(2)}</td></tr>
        `).join("");
        return `
          <div class="chart-section" id="chart-observed" aria-label="训练图表与限制">
            <section class="chart-card">
              <div class="chart-title">
                <div>
                  <span class="mf-eyebrow">OBSERVED SERIES</span>
                  <h2>Loss 与学习率</h2>
                  <p>只画 trainer_state 中已上报的 22 个训练点与 1 个验证点，不外推完成度。</p>
                </div>
                <div class="legend" aria-label="图表图例">
                  <span><i></i>Train Loss</span>
                  <span><i class="eval"></i>Eval Loss</span>
                  <span><i class="lr"></i>Learning Rate</span>
                </div>
              </div>
              <svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="lossTitle lossDesc">
                <title id="lossTitle">Train Loss 从 11.682 降至 0.200，Eval Loss 在 step 22 为 0.215</title>
                <desc id="lossDesc">22 个 Train Loss 采样和一个 Eval Loss 点。图表明确标出验证证据只有一个点。</desc>
                <defs>
                  <linearGradient id="lossArea" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0" stop-color="#4b74d8" stop-opacity="0.16"/>
                    <stop offset="1" stop-color="#4b74d8" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                ${[0, 1, 2, 3, 4].map((i) => {
                  const y = padding.top + i * ((height - padding.top - padding.bottom) / 4);
                  const value = max - i * ((max - min) / 4);
                  return `<line class="chart-grid-line" x1="${padding.left}" x2="${width - padding.right}" y1="${y}" y2="${y}"></line><text class="chart-axis-label" x="3" y="${y + 3}">${value.toFixed(2)}</text>`;
                }).join("")}
                <path class="chart-area" d="${lossPath} L${xFor(attempt.trainLoss.length - 1)},${baselineY} L${padding.left},${baselineY} Z"></path>
                <path class="chart-train" d="${lossPath}"></path>
                <circle class="chart-eval" cx="${evalX}" cy="${evalY}" r="5"></circle>
                <line x1="${evalX}" x2="${evalX}" y1="${evalY + 7}" y2="${baselineY}" stroke="#a6bbb1" stroke-width="1" stroke-dasharray="3 3"></line>
                <rect class="chart-callout" x="${width - 260}" y="18" width="238" height="35" rx="6"></rect>
                <text class="chart-callout-text" x="${width - 248}" y="34">Eval 只有 1 个点，趋势无法判断</text>
                <text class="chart-callout-text" x="${width - 248}" y="45">0.2148 @ step 22 · 不做外推</text>
                ${[1, 6, 12, 17, 22].map((step) => `<text class="chart-axis-label" x="${xFor(step - 1) - 4}" y="${height - 8}">${step}</text>`).join("")}
              </svg>
              <div class="chart-lr-grid">
                <div>
                  <span class="mf-eyebrow">LEARNING RATE</span>
                  <strong>2.00e-4 → 1.02e-6</strong>
                  <span>cosine · 22 个真实采样</span>
                </div>
                <svg viewBox="0 0 ${lrWidth} ${lrHeight}" role="img" aria-label="Learning Rate 按 cosine 轨迹从 2e-4 衰减至 1.02e-6">
                  <path d="M5,${lrHeight - 8} H${lrWidth - 5}" stroke="#e9e5da" stroke-width="1"></path>
                  <path class="chart-lr" d="${lrPath}"></path>
                </svg>
              </div>
              <details class="data-table">
                <summary>查看可访问数据表</summary>
                <table>
                  <thead><tr><th>step</th><th>train loss</th><th>learning rate</th></tr></thead>
                  <tbody>${tableRows}</tbody>
                </table>
              </details>
            </section>
            <section class="limit-card">
              <span class="mf-eyebrow">WHAT CHANGED</span>
              <h2>可观测信号</h2>
              <p class="inspector-detail">以下数字是实际 API 返回事实；报告不会把它们解释成业务准确率。</p>
              <ul class="limit-list">
                <li><strong>Train Loss</strong> 11.682 → 0.1998；仅反映优化目标在训练样本上的变化。</li>
                <li><strong>Eval Loss</strong> 0.2148 @ step 22；只有一个点，不能判断过拟合趋势。</li>
                <li><strong>Token</strong> 24 条样本 41–43 tokens，overflow=[]，未观察到上下文截断。</li>
                <li><strong>显存</strong> 设备峰值 2.40 GiB；不是实时 GPU 曲线，也不能直接外推更大模型。</li>
              </ul>
            </section>
          </div>
        `;
      }

      function renderNoChart() {
        return `
          <section class="limit-card" style="margin-top:14px">
            <div class="mf-eyebrow">NO METRIC SERIES</div>
            <h2>没有可绘制的训练曲线</h2>
            <p class="inspector-detail">${attempt.state === "failed" ? "失败发生在指标产生之前，因此没有 Loss、学习率或显存轨迹。" : "取消前的 Attempt 未形成训练指标；缺失不是 0，也不是健康。"}</p>
            <ul class="limit-list">
              <li>不生成虚假的完成度、Loss 曲线或 GPU 使用率。</li>
              <li>以失败阶段、配置和已有证据矩阵进行复盘。</li>
              <li>禁止据此生成超参数调优建议。</li>
            </ul>
          </section>
        `;
      }

      function renderExperiment(experiment) {
        return `
          <article class="experiment" id="experiment-${ui.escapeHtml(experiment.id)}">
            <div class="experiment-top">
              <span class="mf-status ${experiment.priority === "P0" ? "danger" : experiment.priority === "P1" ? "warning" : "neutral"}">${ui.escapeHtml(experiment.priority)}</span>
              <span class="mf-layer advice">建议</span>
            </div>
            <h3>${ui.escapeHtml(experiment.title)}</h3>
            <p>${ui.escapeHtml(experiment.hypothesis)}</p>
            <div class="expectation"><strong>预期观察：</strong>${ui.escapeHtml(experiment.expectation)}</div>
            <div class="experiment-actions">
              <button type="button" class="mf-button" data-action="copy-experiment" data-experiment-id="${ui.escapeHtml(experiment.id)}">复制建议</button>
              ${experiment.apply
                ? `<button type="button" class="mf-button primary" data-action="apply-experiment" data-experiment-id="${ui.escapeHtml(experiment.id)}">应用建议配置</button>`
                : `<button type="button" class="mf-button quiet">查看证据 ${experiment.evidence.join(" / ")}</button>`}
            </div>
          </article>
        `;
      }

      function renderEmpty() {
        const report = attempt.report;
        root.innerHTML = `
          <div class="view">
            <div class="report-heading">
              <div>
                <div class="report-title-line">
                  <span class="mf-eyebrow">AI RUN DIAGNOSIS / NO REPORT</span>
                  <span class="mf-demo-stamp">原型示例</span>
                  <span class="mf-status neutral">无报告</span>
                </div>
                <h1>这个 Attempt 还没有可用的 AI 报告</h1>
                <p>${ui.escapeHtml(report.sourceNote)} 报告只整理已归档事实，不会为了补齐故事而推测训练结果。</p>
              </div>
              <div class="report-actions">
                <button class="mf-button quiet" type="button" data-action="back-entry">返回详情</button>
                <button class="mf-button primary" type="button" data-action="generate-report">生成有限报告</button>
              </div>
            </div>
            <div class="empty-state">
              <section class="empty-main">
                <div class="empty-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 13h7M9 17h5"/></svg>
                </div>
                <h2>证据不足以回答四个问题</h2>
                <p>已有 Attempt 快照、runtime_report 与 6 个执行文件；缺少 metrics、Adapter 与独立推理验收。可以将这份记录整理成“有限复盘”，但不能生成训练健康度或模型效果结论。</p>
                <div class="entry-actions">
                  <button class="mf-button primary" type="button" data-action="generate-report">生成有限复盘</button>
                  <button class="mf-button" type="button">查看训练日志</button>
                </div>
              </section>
              <aside class="coverage-card">
                <h2>证据覆盖</h2>
                <p class="inspector-detail">3 / 8 类证据可用</p>
                <ul>
                  ${attempt.evidenceCoverage.map(([label, present, note]) => `
                    <li><b>${ui.escapeHtml(label)}</b><span><i class="${present ? "" : "missing"}"></i>${ui.escapeHtml(present ? "有" : "缺失")}</span></li>
                  `).join("")}
                </ul>
              </aside>
            </div>
          </div>
        `;
      }

      function renderLimited() {
        const covered = attempt.evidenceCoverage || [];
        root.innerHTML = `
          <div class="view">
            <div class="report-heading">
              <div>
                <div class="report-title-line">
                  <span class="mf-eyebrow">LIMITED REVIEW / ADVISORY</span>
                  <span class="mf-demo-stamp">原型示例</span>
                  <span class="mf-status unknown">证据不足</span>
                </div>
                <h1>这次 Attempt 已取消；现有证据只能说明“未形成训练结论”</h1>
                <p>已读取 Attempt 快照、runtime 与 6 个执行文件。没有 metrics、Adapter 或推理验收，因此不能评价训练健康度或模型效果。</p>
                <div class="report-meta">
                  <span>有限复盘 <b class="mf-mono">R-LIMITED</b></span>
                  <span>生成于 11/06 19:58</span>
                  <span>${ui.escapeHtml(attempt.displayName)}</span>
                </div>
              </div>
              <div class="report-actions">
                <button class="mf-button quiet" type="button" data-action="back-entry">返回详情</button>
                <button class="mf-button" type="button" data-action="generate-report">重新读取证据</button>
              </div>
            </div>
            <div class="limited-callout">
              <span class="mf-layer limit">限制</span>
              <span>这是“有限复盘”，不是失败根因或训练质量报告。所有缺失项都会显示为“未上报”，不会以 0 代替。</span>
            </div>
            <div class="verdict-grid">
              <article class="verdict-card blocked">
                <div class="verdict-top"><span>TRAINING HEALTH</span><span class="mf-status unknown">无法判断</span></div>
                <h2>没有训练指标，不能评价健康度</h2>
                <p>取消前的 Attempt 未形成 Train/Eval Loss、学习率或显存轨迹。</p>
                <div class="verdict-facts"><span>Train 0 pts</span><span>Eval 0 pts</span><span>GPU peak —</span></div>
              </article>
              <article class="verdict-card delivery blocked">
                <div class="verdict-top"><span>DELIVERABILITY</span><span class="mf-status danger">不可交付</span></div>
                <h2>取消不发布部分 Adapter</h2>
                <p>当前没有 Best / Final Adapter，推理验收未到达。</p>
                <div class="verdict-facts"><span>Adapter 0/2</span><span>Inference 未到达</span><span>6 evidence files</span></div>
              </article>
            </div>
            <div class="diagnosis-layout">
              <section class="findings-panel">
                <div class="findings-toolbar">
                  <div><span class="mf-eyebrow">LIMITED FINDINGS</span><h2>有限复盘</h2></div>
                  <span class="mf-status neutral">2 条观测 · 3 条缺失</span>
                </div>
                <article class="finding">
                  <div class="finding-headline"><div><div class="finding-id">L-01 · 运行事实</div><h3>Attempt 已取消，未发布部分产物</h3></div><span class="mf-status neutral">已观测</span></div>
                  <dl class="finding-copy">
                    <div><dt>观测</dt><dd>state=cancelled，outcome=cancelled；Adapter 记录为 0。</dd></div>
                    <div><dt>推断</dt><dd>现有状态符合“取消后不发布部分 Adapter”的硬门禁。</dd></div>
                    <div><dt>建议</dt><dd>保留证据，不把尝试进入推理试用。</dd></div>
                  </dl>
                  <div class="finding-foot"><span class="confidence">来源：Attempt API / Adapter API</span></div>
                </article>
                <article class="finding">
                  <div class="finding-headline"><div><div class="finding-id">L-02 · 缺失证据</div><h3>无法判断训练健康度</h3></div><span class="mf-status unknown">无法判断</span></div>
                  <dl class="finding-copy">
                    <div><dt>观测</dt><dd>metrics=0，显存峰值为空，没有可绘制的 Loss 曲线。</dd></div>
                    <div><dt>推断</dt><dd>没有数据意味着“不知道”，不是“健康”。</dd></div>
                    <div><dt>建议</dt><dd>如需要训练结论，重新运行并确保指标归档。</dd></div>
                  </dl>
                  <div class="finding-foot"><span class="confidence">来源：metrics / GPU snapshot</span></div>
                </article>
              </section>
              <aside class="inspector">
                <div class="inspector-head"><span class="mf-eyebrow">EVIDENCE COVERAGE</span><h2>只读证据矩阵</h2></div>
                <div class="inspector-body">
                  <div class="coverage-number"><strong>3</strong><span>/ 8 类</span></div>
                  <div class="coverage-bar"><span style="width:38%"></span></div>
                  <ul class="limit-list" style="margin-top:13px">
                    ${covered.map(([label, present, note]) => `<li><strong style="color:${present ? "var(--mf-success)" : "var(--mf-muted)"}">${present ? "有" : "缺失"}</strong>${ui.escapeHtml(label)} · ${ui.escapeHtml(note)}</li>`).join("")}
                  </ul>
                </div>
              </aside>
            </div>
          </div>
        `;
      }

      function render() {
        if (view === "loading") {
          renderLoading();
        } else if (view === "report") {
          if (attempt.report?.exists) renderReport();
          else renderEmpty();
        } else if (view === "limited") {
          renderLimited();
        } else if (view === "empty") {
          renderEmpty();
        } else {
          renderEntry();
        }
        syncReportChrome();
      }

      function rerenderFindings() {
        const list = document.getElementById("findingList");
        const filters = root.querySelector(".filter-row");
        const live = document.getElementById("findingsLive");
        if (!list || !attempt.report) return;
        list.innerHTML = renderFindings(attempt.report.findings);
        if (filters) filters.outerHTML = renderFilters(attempt.report.findings);
        if (live) live.textContent = filterDescription(attempt.report.findings);
      }

      function selectEvidence(id) {
        const item = evidenceFor(attempt, id);
        if (!item) return;
        selectedEvidence = id;
        const body = document.getElementById("inspectorBody");
        if (body) body.innerHTML = renderInspector(item);
        root.querySelectorAll(".mf-evidence-chip, .evidence-index button").forEach((button) => {
          const active = button.dataset.evidence === id;
          button.setAttribute("aria-pressed", String(active));
          if (button.closest(".evidence-index")) button.classList.toggle("is-active", active);
        });
        const inspector = document.getElementById("report-evidence");
        if (window.matchMedia("(max-width: 1080px)").matches) {
          inspector?.scrollIntoView({behavior: "smooth", block: "start"});
        }
      }

      function openApply(experimentId) {
        const experiment = attempt.report?.experiments.find((item) => item.id === experimentId);
        if (!experiment) return;
        currentExperiment = experiment;
        applyDialogBody.innerHTML = `
          <p style="color:var(--mf-muted);font-size:11px;line-height:1.7">${ui.escapeHtml(experiment.title)}</p>
          <div class="dialog-config">
            ${experiment.changes.map(([key, before, after]) => `
              <div><span>${ui.escapeHtml(key)}</span><strong>${ui.escapeHtml(before)} → ${ui.escapeHtml(after)}</strong></div>
            `).join("")}
          </div>
          <div class="dialog-alert"><strong>这只是对照实验：</strong>${ui.escapeHtml(experiment.hypothesis)} 应用后会进入未提交草稿，仍需重新核对数据、基座、兼容性和费用守卫。</div>
        `;
        applyDialog.open(document.activeElement);
      }

      root.addEventListener("click", async (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        const filterButton = event.target.closest("[data-filter]");
        const evidenceButton = event.target.closest("[data-evidence]");
        if (filterButton) {
          filter = filterButton.dataset.filter;
          rerenderFindings();
          return;
        }
        if (evidenceButton) {
          selectEvidence(evidenceButton.dataset.evidence);
          return;
        }
        if (!action) return;
        if (action === "open-report") {
          view = "report";
          selectedEvidence = attempt.state === "failed" ? "E-F1" : "E-01";
          render();
          document.getElementById("viewRoot")?.focus({preventScroll: true});
        } else if (action === "scroll-to") {
          const targetSelector = event.target.closest("[data-scroll-target]")?.dataset.scrollTarget;
          const target = targetSelector ? document.querySelector(targetSelector) : null;
          target?.scrollIntoView({behavior: "smooth", block: "start"});
        } else if (action === "open-evidence") {
          const evidenceId = event.target.closest("[data-evidence-id]")?.dataset.evidenceId;
          if (evidenceId) selectEvidence(evidenceId);
        } else if (action === "generate-report" || action === "regenerate") {
          startGeneration();
        } else if (action === "back-entry") {
          view = "entry";
          render();
        } else if (action === "copy-report") {
          const text = `${attempt.displayName}\n${attempt.report.summary}\n训练健康度：${attempt.report.health.label}\n可交付性：${attempt.report.delivery.label}`;
          const ok = await ui.copyText(text);
          ui.toast(ok ? "报告摘要已复制。" : "复制失败，请手动选择文本。");
        } else if (action === "copy-experiment") {
          const experiment = attempt.report?.experiments.find((item) => item.id === event.target.closest("[data-experiment-id]").dataset.experimentId);
          if (!experiment) return;
          const text = `${experiment.priority} ${experiment.title}\n假设：${experiment.hypothesis}\n预期观察：${experiment.expectation}`;
          const ok = await ui.copyText(text);
          ui.toast(ok ? "建议已复制，不包含虚构指标。" : "复制失败，请手动选择文本。");
        } else if (action === "apply-experiment") {
          openApply(event.target.closest("[data-experiment-id]").dataset.experimentId);
        } else if (action === "copy-evidence") {
          const item = evidenceFor(attempt, event.target.closest("[data-evidence-id]").dataset.evidenceId);
          if (!item) return;
          const text = `${item.id} ${item.title}\n${item.source}\n${item.value}\n限制：${item.limitation}`;
          const ok = await ui.copyText(text);
          ui.toast(ok ? "证据说明已复制。" : "复制失败，请手动选择文本。");
        } else if (action === "refresh") {
          ui.toast("原型示例：未向后端发起刷新请求。");
        }
      });

      root.addEventListener("click", (event) => {
        if (event.target.closest("#refreshEntry")) {
          ui.toast("原型示例：未向后端发起刷新请求。");
        }
      });

      attemptSelect.addEventListener("change", () => {
        if (generationTimer) window.clearTimeout(generationTimer);
        attempt = data.getAttempt(attemptSelect.value);
        filter = "all";
        limitedGenerated = false;
        selectedEvidence = attempt.state === "failed" ? "E-F1" : "E-01";
        view = attempt.report?.exists ? "entry" : "empty";
        render();
        window.scrollTo({top: 0, behavior: "matchMedia('(prefers-reduced-motion: reduce)').matches" ? "auto" : "smooth"});
      });

      confirmApply.addEventListener("click", () => {
        if (!currentExperiment) return;
        applyDialog.close();
        ui.toast("已创建原型配置草稿；未提交训练、未创建 GPU、未修改当前 Attempt。");
      });

      render();
    })();
  </script>
</body>
</html>
