<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案 A · AI 训练诊断信号台 · ModelForge</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    :root {
      --a-rail: 224px;
      --a-top: 58px;
      --mf-muted: #536372;
    }

    body {
      background: var(--mf-canvas);
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 120;
      padding: 10px 14px;
      border-radius: 6px;
      color: white;
      background: var(--mf-brand-deep);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .app-frame {
      display: grid;
      grid-template-columns: var(--a-rail) minmax(0, 1fr);
      min-height: 100vh;
    }

    .rail {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 22px 14px 16px;
      border-right: 1px solid #ddd6c7;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0) 260px),
        var(--mf-canvas-deep);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: white;
      background: var(--mf-brand-deep);
      font-size: 18px;
      font-weight: 760;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .brand-copy strong {
      display: block;
      color: var(--mf-ink);
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .brand-copy small {
      display: block;
      margin-top: 2px;
      color: var(--mf-muted);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .nav-label {
      padding: 5px 10px 8px;
      color: #5d594f;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .side-nav {
      display: grid;
      gap: 3px;
    }

    .side-nav a,
    .side-nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: #596775;
      background: transparent;
      font-size: 12px;
      text-align: left;
    }

    .side-nav a:hover,
    .side-nav button:hover {
      color: var(--mf-ink);
      background: rgba(255, 255, 255, 0.5);
    }

    .side-nav .is-active {
      border-color: #bfccec;
      color: var(--mf-brand-deep);
      background: var(--mf-brand-soft);
      font-weight: 680;
    }

    .side-nav svg {
      width: 16px;
      height: 16px;
    }

    .rail-context {
      margin-top: 25px;
      padding: 13px 12px;
      border: 1px solid #d6cebf;
      border-radius: 9px;
      background: rgba(255, 253, 248, 0.72);
    }

    .rail-context .mf-eyebrow {
      margin-bottom: 8px;
      color: #4b5a67;
      font-size: 11px;
    }

    .rail-context strong {
      display: block;
      font-size: 12px;
      line-height: 1.45;
    }

    .rail-context p {
      margin-top: 6px;
      color: var(--mf-muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .rail-report-nav {
      display: grid;
      gap: 1px;
      margin-top: 10px;
    }

    .rail-report-nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 33px;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--mf-muted);
      font-size: 11px;
    }

    .rail-report-nav a::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a9b3bc;
      content: "";
    }

    .rail-report-nav a:hover {
      color: var(--mf-brand-deep);
      background: rgba(255, 255, 255, 0.55);
    }

    .rail-report-nav a:first-child::before {
      background: var(--mf-brand);
    }

    .rail-report-nav[hidden] {
      display: none;
    }

    .rail-foot {
      margin-top: auto;
      padding: 14px 10px 0;
      color: var(--mf-muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .rail-foot strong {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--mf-success);
      font-size: 11px;
    }

    .rail-foot strong::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .workspace {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: var(--a-top);
      padding: 9px 28px;
      border-bottom: 1px solid var(--mf-line);
      background: rgba(255, 253, 248, 0.94);
      backdrop-filter: blur(10px);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--mf-muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .crumbs a {
      color: var(--mf-brand);
      font-weight: 650;
    }

    .crumbs span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-select {
      position: relative;
      min-width: 0;
    }

    .top-select select {
      max-width: 300px;
      min-height: 34px;
      padding: 5px 26px 5px 9px;
      border: 1px solid var(--mf-line);
      border-radius: 7px;
      color: var(--mf-ink-soft);
      background: #fff;
      font-size: 11px;
    }

    .demo-copy {
      color: var(--mf-muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .mf-demo-stamp,
    .mf-dialog-head .mf-eyebrow {
      font-size: 11px;
    }

    main {
      width: min(100%, 1540px);
      min-width: 0;
      margin: 0 auto;
      padding: 24px 28px 54px;
    }

    .view {
      min-width: 0;
    }

    .detail-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 17px;
    }

    .detail-heading h1 {
      max-width: 980px;
      margin-top: 4px;
      color: var(--mf-ink);
      font-size: clamp(24px, 2.2vw, 34px);
      font-weight: 720;
      line-height: 1.22;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    .detail-heading .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
      margin-top: 7px;
      color: var(--mf-muted);
      font-size: 10px;
    }

    .detail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      padding-top: 2px;
    }

    .detail-tabs {
      display: flex;
      gap: 2px;
      min-width: 0;
      margin-bottom: 18px;
      padding: 0 4px;
      border-bottom: 1px solid var(--mf-line);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .detail-tabs button,
    .detail-tabs a {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 11px 10px;
      border: 0;
      color: var(--mf-muted);
      background: transparent;
      font-size: 11px;
      white-space: nowrap;
    }

    .detail-tabs .active {
      color: var(--mf-brand-deep);
      font-weight: 700;
    }

    .detail-tabs .active::after {
      position: absolute;
      right: 8px;
      bottom: -1px;
      left: 8px;
      height: 2px;
      background: var(--mf-brand);
      content: "";
    }

    .detail-tabs svg {
      width: 14px;
      height: 14px;
    }

    .status-band {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      margin-bottom: 15px;
      padding: 9px 13px;
      border: 1px solid #cad8cf;
      border-radius: 9px;
      color: #355247;
      background: #f4fbf7;
      font-size: 11px;
    }

    .status-band.failure {
      border-color: #e5c5c0;
      color: #713f38;
      background: #fff8f6;
    }

    .status-band .mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mf-success);
      box-shadow: 0 0 0 4px rgba(19, 122, 85, 0.1);
    }

    .status-band.failure .mark {
      background: var(--mf-danger);
      box-shadow: 0 0 0 4px rgba(173, 45, 37, 0.1);
    }

    .status-band strong {
      color: inherit;
    }

    .status-band .boundary {
      margin-left: auto;
      color: var(--mf-muted);
      font-size: 11px;
    }

    .entry-hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.75fr);
      gap: 26px;
      padding: 28px;
      border: 1px solid #bdc9e5;
      border-radius: 13px;
      background:
        linear-gradient(135deg, rgba(33, 77, 184, 0.06), rgba(255, 255, 255, 0) 44%),
        var(--mf-surface);
      box-shadow: var(--mf-shadow-soft);
    }

    .entry-hero::after {
      position: absolute;
      top: -58px;
      right: 33%;
      width: 250px;
      height: 250px;
      border: 1px solid rgba(33, 77, 184, 0.08);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .entry-copy {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .entry-kicker {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .entry-copy h2 {
      max-width: 780px;
      margin-top: 12px;
      font-size: clamp(23px, 2.1vw, 32px);
      font-weight: 690;
      line-height: 1.32;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .entry-copy > p {
      max-width: 720px;
      margin-top: 10px;
      color: var(--mf-muted);
      font-size: 12px;
      line-height: 1.75;
    }

    .entry-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 17px;
    }

    .entry-badges span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 4px 9px;
      border: 1px solid #d3d9df;
      border-radius: 5px;
      color: #475d70;
      background: rgba(255, 255, 255, 0.78);
      font-size: 10px;
    }

    .entry-badges b {
      color: var(--mf-ink);
      font-weight: 700;
    }

    .entry-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 21px;
    }

    .entry-side {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: start;
      gap: 9px;
      padding-left: 24px;
      border-left: 1px solid rgba(167, 181, 202, 0.65);
    }

    .entry-side h3 {
      color: var(--mf-muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .coverage-number {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 2px;
    }

    .coverage-number strong {
      font-family: var(--mf-mono);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.05em;
    }

    .coverage-number span {
      color: var(--mf-muted);
      font-size: 10px;
    }

    .coverage-bar {
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: #e5e9ef;
    }

    .coverage-bar span {
      display: block;
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: var(--mf-brand);
    }

    .coverage-list {
      display: grid;
      gap: 6px;
      margin-top: 2px;
    }

    .coverage-list div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--mf-muted);
      font-size: 10px;
    }

    .coverage-list strong {
      color: var(--mf-ink-soft);
      font-weight: 650;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(290px, 0.76fr);
      gap: 16px;
      margin-top: 16px;
    }

    .overview-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--mf-line);
      border-radius: 10px;
      background: var(--mf-surface);
      box-shadow: var(--mf-shadow-soft);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card-head h2,
    .card-head h3 {
      margin-top: 2px;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .card-head p {
      margin-top: 3px;
      color: var(--mf-muted);
      font-size: 10px;
    }

    .overview-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid #e2ded3;
      border-radius: 8px;
      overflow: hidden;
    }

    .overview-metrics div {
      min-width: 0;
      padding: 13px 14px;
      border-right: 1px solid #e2ded3;
      background: #fffefa;
    }

    .overview-metrics div:last-child {
      border-right: 0;
    }

    .overview-metrics span,
    .overview-metrics strong,
    .overview-metrics small {
      display: block;
    }

    .overview-metrics span {
      color: var(--mf-muted);
      font-size: 9px;
    }

    .overview-metrics strong {
      margin-top: 3px;
      font-family: var(--mf-mono);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .overview-metrics small {
      margin-top: 2px;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .lifecycle {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0;
      margin-top: 15px;
      padding: 13px 10px;
      border: 1px solid #e2ded3;
      border-radius: 8px;
      background: #fffefa;
    }

    .lifecycle span {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      color: var(--mf-success);
      font-size: 9px;
      white-space: nowrap;
    }

    .lifecycle span::before {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .fact-list {
      display: grid;
      gap: 0;
    }

    .fact-list div {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #ece7dc;
      font-size: 10px;
    }

    .fact-list div:last-child {
      border-bottom: 0;
    }

    .fact-list dt {
      color: var(--mf-muted);
    }

    .fact-list dd {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--mf-ink-soft);
    }

    .report-shell {
      min-width: 0;
    }

    .report-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .report-title-line {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .report-heading h1 {
      margin-top: 7px;
      font-size: clamp(26px, 2.45vw, 38px);
      font-weight: 690;
      line-height: 1.2;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .report-heading p {
      max-width: 850px;
      margin-top: 8px;
      color: var(--mf-muted);
      font-size: 11px;
      line-height: 1.75;
    }

    .report-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .report-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 13px;
      margin-top: 9px;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .verdict-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
      margin-bottom: 14px;
    }

    .verdict-card {
      position: relative;
      min-width: 0;
      padding: 18px 18px 16px;
      border: 1px solid var(--mf-line);
      border-radius: 11px;
      background: var(--mf-surface);
      box-shadow: var(--mf-shadow-soft);
    }

    .verdict-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .verdict-top > span:first-child {
      color: var(--mf-muted);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .verdict-card h2 {
      margin-top: 10px;
      font-size: 19px;
      font-weight: 680;
      line-height: 1.35;
      letter-spacing: -0.025em;
    }

    .verdict-card p {
      margin-top: 7px;
      color: var(--mf-muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .verdict-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .verdict-facts span {
      padding: 3px 7px;
      border: 1px solid #e0dcd1;
      border-radius: 4px;
      color: #5a6570;
      background: #fffefa;
      font-family: var(--mf-mono);
      font-size: 9px;
    }

    .verdict-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      min-height: 33px;
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px solid #ece7dc;
    }

    .verdict-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 32px;
      padding: 4px 0;
      border: 0;
      color: var(--mf-brand-deep);
      background: transparent;
      font-size: 10px;
      font-weight: 680;
    }

    .verdict-action:hover {
      color: var(--mf-brand);
    }

    .verdict-action svg {
      width: 13px;
      height: 13px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: minmax(260px, 0.6fr) minmax(0, 1.4fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .summary-lead {
      padding: 20px;
      border: 1px solid #c4d0eb;
      border-radius: 11px;
      background: #f8faff;
    }

    .summary-lead h2 {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: -0.025em;
    }

    .summary-lead p {
      margin-top: 8px;
      color: var(--mf-muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .summary-next {
      display: grid;
      gap: 5px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid #d5def1;
    }

    .summary-next > span {
      color: var(--mf-brand);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .summary-next strong {
      color: var(--mf-ink);
      font-size: 13px;
      line-height: 1.5;
    }

    .summary-next p {
      margin-top: 0;
    }

    .summary-next .mf-button {
      justify-self: start;
      min-height: 34px;
      margin-top: 4px;
      padding: 6px 10px;
      font-size: 10px;
    }

    .summary-answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--mf-line);
      border-radius: 11px;
      overflow: hidden;
      background: var(--mf-surface);
    }

    .summary-answer {
      min-width: 0;
      padding: 15px 16px;
      border-right: 1px solid var(--mf-line);
      border-bottom: 1px solid var(--mf-line);
    }

    .summary-answer:nth-child(2n) {
      border-right: 0;
    }

    .summary-answer:nth-last-child(-n + 2) {
      border-bottom: 0;
    }

    .summary-answer span {
      color: var(--mf-muted);
      font-size: 9px;
      font-weight: 650;
    }

    .summary-answer strong {
      display: block;
      margin-top: 4px;
      color: var(--mf-brand-deep);
      font-size: 12px;
      line-height: 1.45;
    }

    .summary-answer p {
      margin-top: 5px;
      color: var(--mf-muted);
      font-size: 9px;
      line-height: 1.65;
    }

    .diagnosis-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      align-items: start;
      gap: 14px;
    }

    .findings-panel {
      min-width: 0;
      border: 1px solid var(--mf-line);
      border-radius: 11px;
      background: var(--mf-surface);
      box-shadow: var(--mf-shadow-soft);
    }

    .findings-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 18px 13px;
      border-bottom: 1px solid var(--mf-line);
    }

    .findings-toolbar h2 {
      margin-top: 2px;
      font-size: 17px;
      letter-spacing: -0.025em;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-end;
    }

    .findings-live {
      padding: 7px 18px;
      border-bottom: 1px solid #e9e4d9;
      color: var(--mf-muted);
      background: #fbf8f0;
      font-size: 9px;
    }

    .finding-group {
      border-bottom: 1px solid var(--mf-line);
    }

    .finding-group:last-child {
      border-bottom: 0;
    }

    .finding-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      color: var(--mf-muted);
      background: #faf7ef;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .finding-group-head::after {
      flex: 1;
      height: 1px;
      background: #e5dfd2;
      content: "";
    }

    .finding {
      border-top: 1px solid #ece7dc;
      background: var(--mf-surface);
    }

    .finding:first-of-type {
      border-top: 0;
    }

    .finding > summary {
      display: block;
      padding: 16px 18px 13px;
      list-style: none;
      cursor: pointer;
      transition: background-color 160ms ease;
    }

    .finding > summary::-webkit-details-marker {
      display: none;
    }

    .finding > summary:hover {
      background: #fffcf5;
    }

    .finding > summary:focus-visible {
      outline: 2px solid var(--mf-brand);
      outline-offset: -3px;
    }

    .finding[open] > summary {
      background: #fffdf8;
    }

    .finding-content {
      padding: 0 18px 16px;
    }

    .finding-state {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .finding-chevron {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      color: var(--mf-muted);
      background: #f4f0e7;
      transition: transform 180ms ease, color 180ms ease;
    }

    .finding-chevron svg {
      width: 14px;
      height: 14px;
    }

    .finding[open] .finding-chevron {
      color: var(--mf-brand-deep);
      transform: rotate(180deg);
    }

    .finding-preview {
      display: -webkit-box;
      margin-top: 7px;
      overflow: hidden;
      color: var(--mf-muted);
      font-size: 10px;
      line-height: 1.6;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .finding-headline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .finding-id {
      color: var(--mf-muted-2);
      font-family: var(--mf-mono);
      font-size: 9px;
    }

    .finding h3 {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: -0.012em;
    }

    .finding-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      margin-top: 7px;
    }

    .finding-meta > span:not(.mf-layer):not(.mf-status) {
      color: var(--mf-muted);
      font-size: 9px;
    }

    .finding-copy {
      display: grid;
      gap: 7px;
      margin-top: 11px;
    }

    .finding-copy div {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 8px;
      font-size: 10px;
      line-height: 1.65;
    }

    .finding-copy dt {
      color: var(--mf-muted-2);
      font-size: 9px;
      font-weight: 700;
    }

    .finding-copy dd {
      color: #455765;
    }

    .finding-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 11px;
    }

    .evidence-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .confidence {
      color: var(--mf-muted);
      font-size: 9px;
    }

    .inspector {
      position: sticky;
      top: calc(var(--a-top) + 14px);
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--mf-line);
      border-radius: 11px;
      background: var(--mf-surface);
      box-shadow: var(--mf-shadow-soft);
    }

    .inspector-head {
      padding: 16px 16px 13px;
      border-bottom: 1px solid var(--mf-line);
      background: #fbf8f0;
    }

    .inspector-head h2 {
      margin-top: 3px;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .inspector-body {
      padding: 15px 16px;
    }

    .evidence-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border: 1px solid #b9c8d8;
      border-radius: 4px;
      color: #345168;
      background: #f9fcff;
      font-family: var(--mf-mono);
      font-size: 9px;
    }

    .inspector-value {
      margin-top: 11px;
      color: var(--mf-ink);
      font-family: var(--mf-mono);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .inspector-detail {
      margin-top: 7px;
      color: var(--mf-muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .inspector-facts {
      display: grid;
      gap: 0;
      margin-top: 12px;
      border-top: 1px solid #ece7dc;
    }

    .inspector-facts div {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #f0ece3;
      font-size: 9px;
    }

    .inspector-facts dt {
      color: var(--mf-muted);
    }

    .inspector-facts dd {
      min-width: 0;
      color: #465867;
      overflow-wrap: anywhere;
    }

    .inspector-note {
      margin-top: 12px;
      padding: 9px 10px;
      border: 1px solid #eadfbf;
      border-radius: 6px;
      color: #675b3b;
      background: #fff9e8;
      font-size: 9px;
      line-height: 1.65;
    }

    .evidence-index {
      display: grid;
      gap: 2px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e7e1d6;
    }

    .evidence-index-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      color: var(--mf-muted);
      font-size: 8px;
      font-weight: 760;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .evidence-index button {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      min-height: 31px;
      padding: 4px 6px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #526270;
      background: transparent;
      font-size: 9px;
      text-align: left;
    }

    .evidence-index button:hover {
      background: #faf7ef;
    }

    .evidence-index button.is-active {
      border-color: #bfccec;
      color: var(--mf-brand-deep);
      background: var(--mf-brand-soft);
    }

    .evidence-index button:focus-visible {
      outline: 2px solid var(--mf-brand);
      outline-offset: 1px;
    }

    .evidence-index .id {
      color: inherit;
      font-family: var(--mf-mono);
      font-weight: 620;
    }

    .evidence-index .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .evidence-index .kind {
      color: var(--mf-muted);
      font-size: 8px;
    }

    .chart-section {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(270px, 0.6fr);
      align-items: start;
      gap: 14px;
      margin-top: 14px;
    }

    .chart-card,
    .limit-card,
    .experiment-panel {
      min-width: 0;
      border: 1px solid var(--mf-line);
      border-radius: 11px;
      background: var(--mf-surface);
      box-shadow: var(--mf-shadow-soft);
    }

    .chart-card {
      padding: 17px 18px 14px;
    }

    .chart-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .chart-title h2 {
      margin-top: 2px;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .chart-title p {
      margin-top: 4px;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend i {
      width: 12px;
      height: 2px;
      background: #4b74d8;
    }

    .legend i.eval {
      height: 6px;
      border-radius: 50%;
      background: #178a70;
    }

    .legend i.lr {
      background: #bf8727;
    }

    .chart-svg {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 10px;
      overflow: visible;
    }

    .chart-grid-line {
      stroke: #e9e5da;
      stroke-width: 1;
    }

    .chart-axis-label {
      fill: #7a8792;
      font-family: var(--mf-mono);
      font-size: 8px;
    }

    .chart-train {
      fill: none;
      stroke: #4b74d8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.1;
    }

    .chart-area {
      fill: url(#lossArea);
      opacity: 0.7;
    }

    .chart-eval {
      fill: #fffdf8;
      stroke: #178a70;
      stroke-width: 2;
    }

    .chart-callout {
      fill: #fff9e8;
      stroke: #dac683;
      stroke-width: 1;
    }

    .chart-callout-text {
      fill: #6c5718;
      font-family: var(--mf-sans);
      font-size: 8.5px;
      font-weight: 600;
    }

    .chart-lr {
      fill: none;
      stroke: #bf8727;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .chart-lr-grid {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #ece7dc;
    }

    .chart-lr-grid strong {
      display: block;
      font-family: var(--mf-mono);
      font-size: 11px;
    }

    .chart-lr-grid span {
      display: block;
      margin-top: 2px;
      color: var(--mf-muted);
      font-size: 8px;
    }

    .data-table {
      margin-top: 9px;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .data-table summary {
      width: fit-content;
      color: var(--mf-brand);
      font-weight: 650;
    }

    .data-table table {
      width: 100%;
      margin-top: 8px;
      border-collapse: collapse;
      font-family: var(--mf-mono);
      font-size: 8px;
    }

    .data-table th,
    .data-table td {
      padding: 5px 6px;
      border: 1px solid #e8e3d8;
      text-align: left;
    }

    .limit-card {
      padding: 17px 18px;
      background: #fbfaf5;
    }

    .limit-card h2 {
      margin-top: 2px;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .limit-list {
      display: grid;
      gap: 0;
      margin-top: 12px;
    }

    .limit-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 0;
      border-top: 1px solid #e8e2d6;
      color: var(--mf-muted);
      font-size: 9px;
      line-height: 1.6;
      list-style: none;
    }

    .limit-list li::before {
      display: grid;
      place-items: center;
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border: 1px dashed #a8b2b8;
      border-radius: 50%;
      color: #75838c;
      content: "i";
      font: 8px var(--mf-mono);
    }

    .experiment-panel {
      margin-top: 14px;
      overflow: hidden;
    }

    .experiment-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 18px 14px;
      border-bottom: 1px solid var(--mf-line);
    }

    .experiment-head h2 {
      margin-top: 2px;
      font-size: 17px;
      letter-spacing: -0.025em;
    }

    .experiment-head p {
      margin-top: 4px;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .experiment-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .experiment {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 16px 18px;
      border-right: 1px solid var(--mf-line);
    }

    .experiment:last-child {
      border-right: 0;
    }

    .experiment-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .experiment h3 {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.45;
    }

    .experiment p {
      margin-top: 6px;
      color: var(--mf-muted);
      font-size: 9px;
      line-height: 1.65;
    }

    .experiment .expectation {
      margin-top: 8px;
      padding: 8px;
      border: 1px dashed #d7cfbc;
      border-radius: 5px;
      color: #5b5a50;
      background: #fdfbf5;
      font-size: 9px;
      line-height: 1.55;
    }

    .experiment-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 12px;
    }

    .experiment-actions .mf-button {
      min-height: 32px;
      padding: 5px 9px;
      font-size: 9px;
    }

    .ask-box {
      margin-top: 14px;
      padding: 16px 18px;
      border: 1px solid var(--mf-line);
      border-radius: 11px;
      background: var(--mf-surface);
    }

    .ask-box form {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .ask-box input {
      flex: 1;
      min-width: 0;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--mf-line-strong);
      border-radius: 7px;
      color: var(--mf-ink);
      background: #fff;
      font-size: 11px;
    }

    .ask-response {
      margin-top: 10px;
      padding: 10px 11px;
      border-left: 2px solid var(--mf-brand);
      color: #38546c;
      background: #f4f7ff;
      font-size: 10px;
      line-height: 1.65;
    }

    .empty-state {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      margin-top: 16px;
    }

    .empty-main {
      padding: 26px;
      border: 1px dashed #bbb39f;
      border-radius: 11px;
      background: rgba(255, 253, 248, 0.76);
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid #c9c2b3;
      border-radius: 9px;
      color: var(--mf-brand);
      background: #fff;
    }

    .empty-main h2 {
      margin-top: 13px;
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .empty-main p {
      max-width: 680px;
      margin-top: 7px;
      color: var(--mf-muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .empty-main .entry-actions {
      margin-top: 16px;
    }

    .coverage-card {
      padding: 18px;
      border: 1px solid var(--mf-line);
      border-radius: 11px;
      background: var(--mf-surface);
    }

    .coverage-card h2 {
      font-size: 15px;
    }

    .coverage-card ul {
      display: grid;
      gap: 0;
      margin-top: 11px;
    }

    .coverage-card li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid #ece7dc;
      color: var(--mf-muted);
      font-size: 9px;
      list-style: none;
    }

    .coverage-card li b {
      color: var(--mf-ink-soft);
      font-weight: 650;
    }

    .coverage-card li span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .coverage-card li i {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mf-success);
    }

    .coverage-card li i.missing {
      background: #b8c0c7;
    }

    .loading-view {
      display: grid;
      place-items: center;
      min-height: 580px;
      padding: 30px;
    }

    .loading-card {
      width: min(680px, 100%);
      padding: 28px;
      border: 1px solid #c7d1e6;
      border-radius: 13px;
      background: var(--mf-surface);
      box-shadow: var(--mf-shadow);
    }

    .loading-mark {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 25px;
      height: 25px;
      border: 2px solid #d5dded;
      border-top-color: var(--mf-brand);
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-card h1 {
      margin-top: 18px;
      font-size: 25px;
      letter-spacing: -0.035em;
    }

    .loading-card > p {
      margin-top: 7px;
      color: var(--mf-muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .loading-steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 20px;
    }

    .loading-step {
      min-width: 0;
      padding: 10px;
      border: 1px solid #e1dcd1;
      border-radius: 7px;
      color: var(--mf-muted);
      background: #fbf8f0;
      font-size: 9px;
      line-height: 1.5;
    }

    .loading-step.is-current {
      border-color: #9db0e3;
      color: var(--mf-brand-deep);
      background: var(--mf-brand-soft);
    }

    .loading-step::before {
      display: block;
      width: 6px;
      height: 6px;
      margin-bottom: 6px;
      border-radius: 50%;
      background: #adb6bf;
      content: "";
    }

    .loading-step.is-current::before {
      background: var(--mf-brand);
    }

    .report-jump {
      display: none;
    }

    .report-shell [id],
    #report-summary,
    #report-findings,
    #report-evidence,
    #chart-observed,
    #report-experiments,
    #report-limits {
      scroll-margin-top: calc(var(--a-top) + 16px);
    }

    .limited-callout {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 13px;
      padding: 12px 13px;
      border: 1px solid #dfc987;
      border-radius: 8px;
      color: #65531e;
      background: #fff9e8;
      font-size: 10px;
      line-height: 1.65;
    }

    .dialog-config {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .dialog-config div {
      padding: 9px 10px;
      border: 1px solid #e3ded4;
      border-radius: 6px;
      background: #fbfaf5;
    }

    .dialog-config span {
      display: block;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .dialog-config strong {
      display: block;
      margin-top: 3px;
      font-family: var(--mf-mono);
      font-size: 12px;
    }

    .dialog-alert {
      margin-top: 14px;
      padding: 10px 11px;
      border-left: 3px solid var(--mf-warning);
      color: #675a39;
      background: #fff9e8;
      font-size: 10px;
      line-height: 1.65;
    }

    @media (max-width: 1220px) {
      .diagnosis-layout {
        grid-template-columns: minmax(0, 1fr) 300px;
      }

      .entry-hero {
        grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.7fr);
      }
    }

    @media (max-width: 1080px) {
      :root {
        --a-rail: 190px;
      }

      main {
        padding-right: 20px;
        padding-left: 20px;
      }

      .topbar {
        padding-right: 20px;
        padding-left: 20px;
      }

      .diagnosis-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .inspector {
        position: static;
      }

      .overview-grid,
      .empty-state {
        grid-template-columns: minmax(0, 1fr);
      }

      .experiment-list {
        grid-template-columns: 1fr;
      }

      .experiment {
        border-right: 0;
        border-bottom: 1px solid var(--mf-line);
      }

      .experiment:last-child {
        border-bottom: 0;
      }
    }

    @media (max-width: 840px) {
      .app-frame {
        display: block;
      }

      .rail {
        position: relative;
        height: auto;
        padding: 13px 16px 10px;
        border-right: 0;
        border-bottom: 1px solid var(--mf-line);
      }

      .brand {
        padding: 0;
      }

      .brand-mark {
        width: 31px;
        height: 31px;
      }

      .side-nav,
      .rail-context,
      .rail-report-nav,
      .rail-foot,
      .nav-label {
        display: none;
      }

      .topbar {
        position: relative;
        flex-wrap: wrap;
        padding: 9px 16px;
      }

      .demo-copy {
        display: none;
      }

      .crumbs {
        width: 100%;
      }

      .topbar-right {
        width: 100%;
        justify-content: space-between;
      }

      .top-select {
        flex: 1;
      }

      .top-select select {
        width: 100%;
        max-width: none;
      }

      main {
        padding: 17px 16px 44px;
      }

      .detail-heading,
      .report-heading {
        display: block;
      }

      .report-jump {
        position: sticky;
        top: var(--a-top);
        z-index: 24;
        display: flex;
        gap: 4px;
        margin: 0 -20px 14px;
        padding: 7px 20px;
        overflow-x: auto;
        border-top: 1px solid #e8e2d7;
        border-bottom: 1px solid #e8e2d7;
        background: rgba(255, 253, 248, 0.96);
        scrollbar-width: thin;
        backdrop-filter: blur(8px);
      }

      .report-jump a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 7px 12px;
        border: 1px solid #ddd7ca;
        border-radius: 999px;
        color: #556575;
        background: #fffefa;
        font-size: 10px;
        white-space: nowrap;
      }

      .report-jump a:hover,
      .report-jump a:focus-visible {
        border-color: #b9c7e8;
        color: var(--mf-brand-deep);
        background: var(--mf-brand-soft);
      }

      .detail-actions,
      .report-actions {
        margin-top: 13px;
        justify-content: flex-start;
      }

      .entry-hero {
        grid-template-columns: 1fr;
        padding: 21px;
      }

      .entry-hero::after {
        display: none;
      }

      .entry-side {
        padding-top: 17px;
        padding-left: 0;
        border-top: 1px solid var(--mf-line);
        border-left: 0;
      }

      .overview-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .overview-metrics div:nth-child(2) {
        border-right: 0;
      }

      .overview-metrics div:nth-child(-n + 2) {
        border-bottom: 1px solid #e2ded3;
      }

      .lifecycle {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .verdict-grid,
      .summary-grid,
      .chart-section {
        grid-template-columns: minmax(0, 1fr);
      }

      .summary-answers {
        grid-template-columns: 1fr;
      }

      .summary-answer {
        border-right: 0;
        border-bottom: 1px solid var(--mf-line);
      }

      .summary-answer:nth-last-child(-n + 2) {
        border-bottom: 1px solid var(--mf-line);
      }

      .summary-answer:last-child {
        border-bottom: 0;
      }

      .findings-toolbar {
        display: block;
      }

      .filter-row {
        justify-content: flex-start;
        margin-top: 11px;
      }

      .chart-lr-grid {
        grid-template-columns: 1fr;
      }

      .empty-state {
        grid-template-columns: 1fr;
      }

      .status-band {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .status-band .boundary {
        width: 100%;
        margin-left: 20px;
      }
    }

    @media (max-width: 520px) {
      h1,
      .report-heading h1 {
        font-size: 26px;
      }

      .entry-copy h2 {
        font-size: 23px;
      }

      .detail-tabs {
        margin-right: -16px;
        margin-left: -16px;
        padding-left: 10px;
      }

      .topbar-left {
        display: none;
      }

      .overview-metrics {
        grid-template-columns: 1fr;
      }

      .overview-metrics div {
        border-right: 0;
        border-bottom: 1px solid #e2ded3;
      }

      .overview-metrics div:last-child {
        border-bottom: 0;
      }

      .lifecycle {
        grid-template-columns: 1fr 1fr;
      }

      .finding-copy div {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .report-jump {
        margin-right: -16px;
        margin-left: -16px;
        padding-right: 16px;
        padding-left: 16px;
      }

      .loading-steps {
        grid-template-columns: 1fr 1fr;
      }

      .dialog-config {
        grid-template-columns: 1fr;
      }

      .ask-box form {
        flex-direction: column;
      }

      .ask-box .mf-button {
        width: 100%;
      }

      .experiment-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .verdict-actions {
        justify-content: flex-start;
      }

      .verdict-action,
      .summary-next .mf-button,
      .evidence-index button {
        min-height: 44px;
      }

      .finding > summary {
        padding: 15px 16px 12px;
      }

      .finding-content {
        padding: 0 16px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="app-frame">

        <a href="#models">

      <div class="rail-context">

  <div class="mf-dialog-backdrop" id="applyDialog" hidden>
    <section class="mf-dialog" role="dialog" aria-modal="true" aria-labelledby="applyDialogTitle" aria-describedby="applyDialogDescription" tabindex="-1">
      <header class="mf-dialog-head">
        <div>
          <span class="mf-eyebrow">DRAFT ONLY · 原型示例</span>
          <h2 id="applyDialogTitle">应用建议配置？</h2>
          <p id="applyDialogDescription">只会创建一份新训练配置草稿，不修改当前 Attempt，也不会提交训练或创建实例。</p>
        </div>
        <button class="mf-button quiet" type="button" data-dialog-close aria-label="关闭对话框">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>

        <button class="mf-button quiet" type="button" data-dialog-close>取消</button>
