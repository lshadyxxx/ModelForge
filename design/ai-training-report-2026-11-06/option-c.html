<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案 C · AI 训练证据审计台 · ModelForge</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    :root {
      --c-ink: #122535;
      --c-navy: #173251;
      --c-navy-2: #0f2945;
      --c-paper: #fbf8ef;
      --c-paper-2: #f3eee1;
      --c-rule: #d5cdbd;
      --c-rule-strong: #a99f8d;
      --c-blue: #2457c5;
      --c-blue-soft: #e9effc;
      --c-amber: #a66f0b;
      --c-amber-soft: #fff5d8;
      --c-red: #aa332b;
      --c-red-soft: #fff0ed;
      --c-green: #176d4f;
      --c-green-soft: #e9f5ef;
      --c-gray-soft: #eef1ef;
      --c-serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Songti SC", serif;
    }

    html {
      background: #e6e0d3;
    }

    body {
      color: var(--c-ink);
      background:
        linear-gradient(90deg, rgba(23, 50, 81, 0.025) 1px, transparent 1px),
        linear-gradient(rgba(23, 50, 81, 0.025) 1px, transparent 1px),
        #e9e4d8;
      background-size: 24px 24px;
    }

    button,
    select,
    input {
      letter-spacing: 0;
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 9px 13px;
      border-radius: 4px;
      color: #fff;
      background: var(--c-navy);
      transform: translateY(-150%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .audit-top {
      position: sticky;
      top: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) auto;
      align-items: stretch;
      min-height: 62px;
      border-bottom: 1px solid #08192a;
      color: #eef4fb;
      background: var(--c-navy-2);
      box-shadow: 0 2px 10px rgba(15, 41, 69, 0.16);
    }

    .audit-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 9px 20px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }

    .audit-mark {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      color: #fff;
      background: transparent;
      font-family: var(--c-serif);
      font-size: 19px;
      font-weight: 700;
    }

    .audit-brand strong {
      display: block;
      font-family: var(--c-serif);
      font-size: 16px;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .audit-brand small {
      display: block;
      margin-top: 3px;
      color: #aec0d4;
      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .audit-crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0 22px;
      color: #a9bcd0;
      font-size: 11px;
    }

    .audit-crumbs a {
      color: #dbe8f7;
      text-decoration: underline;
      text-decoration-color: rgba(219, 232, 247, 0.35);
      text-underline-offset: 4px;
    }

    .audit-crumbs strong {
      overflow: hidden;
      color: #fff;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .audit-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
    }

    .audit-tools .mf-demo-stamp {
      border-color: rgba(241, 205, 108, 0.45);
      color: #f7dfa7;
      background: rgba(152, 108, 15, 0.22);
    }

    .audit-tools .mf-demo-stamp::before {
      background: #e8bd55;
    }

    .audit-select {
      width: 240px;
      min-height: 35px;
      padding: 6px 30px 6px 9px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 3px;
      color: #f3f8ff;
      background: #183a5d;
      font-size: 10px;
    }

    .audit-tools .mf-button {
      min-height: 34px;
      border-color: rgba(255, 255, 255, 0.23);
      color: #e9f2fc;
      background: rgba(255, 255, 255, 0.04);
      font-size: 10px;
    }

    .audit-tools .mf-button:hover:not(:disabled) {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.1);
    }

    .audit-shell {
      width: min(1510px, calc(100% - 32px));
      margin: 16px auto 52px;
      border: 1px solid #bdb4a4;
      background: var(--c-paper);
      box-shadow: 0 20px 70px rgba(26, 43, 58, 0.12);
    }

    .case-ribbon {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 34px;
      padding: 7px 20px;
      border-bottom: 1px solid #0d2036;
      color: #bdd0e2;
      background: var(--c-navy);
      font-family: var(--mf-mono);
      font-size: 9px;
      letter-spacing: 0.04em;
    }

    .case-ribbon span {
      min-width: 0;
    }

    .case-ribbon strong {
      color: #fff;
      font-weight: 600;
    }

    .case-ribbon .ribbon-push {
      margin-left: auto;
    }

    .entry-wrap,
    .report-wrap {
      padding: 26px 28px 36px;
    }

    .entry-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 26px;
      align-items: start;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--c-ink);
    }

    .entry-kicker,
    .report-kicker {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 11px;
    }

    .entry-heading h1,
    .report-heading h1,
    .empty-heading h1,
    .loading-heading h1 {
      max-width: 900px;
      color: var(--c-ink);
      font-family: var(--c-serif);
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 600;
      line-height: 1.13;
      letter-spacing: -0.035em;
    }

    .entry-meta,
    .report-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 16px;
      margin-top: 15px;
      color: var(--mf-muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .entry-meta .mono,
    .report-meta .mono {
      font-family: var(--mf-mono);
    }

    .entry-actions {
      display: grid;
      gap: 8px;
      justify-items: stretch;
      padding: 14px;
      border: 1px solid var(--c-rule);
      background: #f6f1e5;
    }

    .entry-actions .mf-button {
      width: 100%;
      border-radius: 3px;
    }

    .entry-actions p {
      margin-top: 3px;
      color: var(--mf-muted);
      font-size: 9px;
      line-height: 1.55;
    }

    .status-slash {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 25px;
      padding: 2px 8px;
      border: 1px solid currentColor;
      color: var(--c-green);
      background: var(--c-green-soft);
      font-family: var(--mf-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status-slash.warning {
      color: var(--c-amber);
      background: var(--c-amber-soft);
    }

    .status-slash.danger {
      color: var(--c-red);
      background: var(--c-red-soft);
    }

    .status-slash.neutral {
      color: #5c6972;
      background: var(--c-gray-soft);
    }

    .entry-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(300px, 0.85fr);
      gap: 0;
      border-right: 1px solid var(--c-rule);
      border-bottom: 1px solid var(--c-rule);
      border-left: 1px solid var(--c-rule);
    }

    .entry-main {
      min-width: 0;
      padding: 22px 24px 24px;
      border-right: 1px solid var(--c-rule);
    }

    .entry-side {
      min-width: 0;
      padding: 20px;
      background: #f5f0e4;
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
      color: #60707d;
      font-family: var(--mf-mono);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .section-label::after {
      height: 1px;
      flex: 1;
      background: var(--c-rule);
      content: "";
    }

    .section-label span {
      white-space: nowrap;
    }

    .gate-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--c-rule-strong);
      background: #fffef9;
    }

    .gate {
      position: relative;
      min-width: 0;
      padding: 16px 17px 14px;
    }

    .gate + .gate {
      border-left: 1px solid var(--c-rule);
    }

    .gate::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: var(--c-amber);
      content: "";
    }

    .gate.delivery::before {
      background: var(--c-blue);
    }

    .gate.failed::before {
      background: var(--c-red);
    }

    .gate-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .gate-head > span:first-child {
      color: var(--mf-muted);
      font-family: var(--mf-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }

    .gate h2 {
      margin-top: 9px;
      font-family: var(--c-serif);
      font-size: 21px;
      font-weight: 600;
      line-height: 1.25;
    }

    .gate p {
      margin-top: 7px;
      color: var(--mf-muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .gate-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 12px;
    }

    .gate-facts span {
      padding: 3px 6px;
      border: 1px solid #ded7ca;
      color: #52616c;
      background: #f8f5ec;
      font-family: var(--mf-mono);
      font-size: 8px;
    }

    .entry-digest {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 16px;
      border: 1px solid var(--c-rule);
      background: #fffdf8;
    }

    .digest-cell {
      min-width: 0;
      padding: 11px 12px;
      border-right: 1px solid var(--c-rule);
    }

    .digest-cell:last-child {
      border-right: 0;
    }

    .digest-cell span {
      display: block;
      color: var(--mf-muted);
      font-size: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .digest-cell strong {
      display: block;
      overflow: hidden;
      margin-top: 4px;
      font-family: var(--mf-mono);
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-question-list {
      display: grid;
      gap: 0;
      margin-top: 15px;
      border-top: 1px solid var(--c-rule);
    }

    .entry-question {
      display: grid;
      grid-template-columns: 125px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid var(--c-rule);
    }

    .entry-question span:first-child {
      color: var(--mf-muted);
      font-size: 10px;
    }

    .entry-question strong {
      font-family: var(--c-serif);
      font-size: 14px;
      font-weight: 600;
    }

    .entry-question small {
      color: var(--mf-muted);
      font-size: 9px;
    }

    .ai-entry-card {
      position: relative;
      border: 1px solid #9eacbd;
      background: #fffef9;
      box-shadow: 7px 7px 0 #e2dbc9;
    }

    .ai-entry-card::before {
      display: block;
      height: 5px;
      background: linear-gradient(90deg, var(--c-navy) 0 67%, var(--c-blue) 67% 82%, var(--c-amber) 82%);
      content: "";
    }

    .ai-card-body {
      padding: 17px;
    }

    .ai-card-body .mf-eyebrow {
      color: var(--c-blue);
    }

    .ai-card-body h2 {
      margin-top: 7px;
      font-family: var(--c-serif);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
    }

    .ai-card-body p {
      margin-top: 9px;
      color: var(--mf-muted);
      font-size: 10px;
      line-height: 1.75;
    }

    .ai-card-actions {
      display: grid;
      gap: 7px;
      margin-top: 15px;
    }

    .ai-card-actions .mf-button {
      border-radius: 3px;
    }

    .card-boundary {
      margin-top: 13px;
      padding: 9px 10px;
      border-left: 3px solid var(--c-amber);
      color: #665a40;
      background: var(--c-amber-soft);
      font-size: 9px;
      line-height: 1.65;
    }

    .coverage-sheet {
      margin-top: 18px;
    }

    .coverage-sheet h3 {
      font-size: 11px;
      font-weight: 700;
    }

    .coverage-grid {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      margin-top: 8px;
      border-top: 1px solid var(--c-rule);
    }

    .coverage-grid > * {
      padding: 6px 4px;
      border-bottom: 1px solid #ded8cb;
      font-size: 9px;
    }

    .coverage-grid .mark {
      color: var(--c-green);
      font-family: var(--mf-mono);
      font-weight: 700;
    }

    .coverage-grid .mark.missing {
      color: var(--c-red);
    }

    .coverage-grid .state {
      color: var(--mf-muted);
      font-family: var(--mf-mono);
      font-size: 8px;
    }

    .report-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--c-ink);
    }

    .report-heading h1 {
      max-width: 1000px;
      font-size: clamp(26px, 2.6vw, 38px);
    }

    .report-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .report-actions .mf-button {
      border-radius: 3px;
    }

    .verdict-ledger {
      display: grid;
      grid-template-columns: 160px repeat(2, minmax(0, 1fr));
      border-right: 1px solid var(--c-rule);
      border-bottom: 1px solid var(--c-rule);
      border-left: 1px solid var(--c-rule);
      background: #fffdf7;
    }

    .ledger-label {
      display: grid;
      place-items: center start;
      padding: 14px 17px;
      border-right: 1px solid var(--c-rule);
      color: var(--mf-muted);
      background: #f2ede2;
      font-family: var(--mf-mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .ledger-verdict {
      min-width: 0;
      padding: 15px 18px;
    }

    .ledger-verdict + .ledger-verdict {
      border-left: 1px solid var(--c-rule);
    }

    .ledger-verdict-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--mf-muted);
      font-family: var(--mf-mono);
      font-size: 8px;
      letter-spacing: 0.07em;
    }

    .ledger-verdict h2 {
      margin-top: 8px;
      font-family: var(--c-serif);
      font-size: 19px;
      font-weight: 600;
      line-height: 1.3;
    }

    .ledger-verdict p {
      margin-top: 5px;
      color: var(--mf-muted);
      font-size: 9px;
      line-height: 1.62;
    }

    .report-grid {
      display: grid;
      grid-template-columns: 218px minmax(0, 1fr) 306px;
      align-items: start;
      gap: 0;
      border-right: 1px solid var(--c-rule);
      border-left: 1px solid var(--c-rule);
    }

    .timeline-column {
      position: sticky;
      top: 78px;
      align-self: start;
      min-width: 0;
      border-right: 1px solid var(--c-rule);
      background: #f5f0e4;
    }

    .timeline-head {
      padding: 15px 15px 11px;
      border-bottom: 1px solid var(--c-rule);
    }

    .timeline-head h2 {
      margin-top: 4px;
      font-family: var(--c-serif);
      font-size: 17px;
      font-weight: 600;
    }

    .timeline {
      padding: 6px 0 12px;
    }

    .timeline-event {
      position: relative;
      display: block;
      width: 100%;
      padding: 10px 12px 10px 37px;
      border: 0;
      border-bottom: 1px solid #ded7ca;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .timeline-event::before {
      position: absolute;
      top: 15px;
      left: 18px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--c-paper);
      border-radius: 50%;
      background: #94a0a8;
      box-shadow: 0 0 0 1px #b6ada0;
      content: "";
    }

    .timeline-event::after {
      position: absolute;
      top: 26px;
      bottom: -11px;
      left: 22px;
      width: 1px;
      background: #c6bcad;
      content: "";
    }

    .timeline-event:last-child::after {
      display: none;
    }

    .timeline-event:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .timeline-event.is-active {
      background: #fffaf0;
      box-shadow: inset 3px 0 var(--c-blue);
    }

    .timeline-event.is-active::before {
      background: var(--c-blue);
      box-shadow: 0 0 0 1px var(--c-blue);
    }

    .timeline-event.danger::before {
      background: var(--c-red);
      box-shadow: 0 0 0 1px var(--c-red);
    }

    .timeline-event.warning::before {
      background: var(--c-amber);
      box-shadow: 0 0 0 1px var(--c-amber);
    }

    .timeline-event.passed::before {
      background: var(--c-green);
      box-shadow: 0 0 0 1px var(--c-green);
    }

    .timeline-event span {
      display: block;
      color: #7b837f;
      font-family: var(--mf-mono);
      font-size: 7px;
      letter-spacing: 0.05em;
    }

    .timeline-event strong {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.4;
    }

    .timeline-event small {
      display: block;
      margin-top: 3px;
      color: var(--mf-muted);
      font-size: 8px;
      line-height: 1.5;
    }

    .timeline-foot {
      margin: 4px 12px 14px;
      padding: 10px;
      border: 1px solid #d6cebe;
      background: #fffaf0;
    }

    .timeline-foot strong {
      display: block;
      font-family: var(--mf-mono);
      font-size: 10px;
    }

    .timeline-foot span {
      display: block;
      margin-top: 2px;
      color: var(--mf-muted);
      font-size: 8px;
      line-height: 1.55;
    }

    .ledger-column {
      min-width: 0;
      padding: 17px 18px 0;
    }

    .ledger-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--c-ink);
    }

    .ledger-toolbar h2 {
      margin-top: 3px;
      font-family: var(--c-serif);
      font-size: 23px;
      font-weight: 600;
    }

    .ledger-toolbar p {
      margin-top: 4px;
      color: var(--mf-muted);
      font-size: 9px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
    }

    .filter-button {
      min-height: 27px;
      padding: 3px 8px;
      border: 1px solid var(--c-rule);
      border-radius: 2px;
      color: var(--mf-muted);
      background: #fff;
      font-size: 8px;
      font-weight: 650;
    }

    .filter-button:hover {
      border-color: #a6b5c5;
      color: var(--c-ink);
    }

    .filter-button.is-active {
      border-color: var(--c-navy);
      color: #fff;
      background: var(--c-navy);
    }

    .filter-button b {
      margin-left: 5px;
      font-family: var(--mf-mono);
      font-size: 8px;
    }

    .filter-note {
      margin: 8px 0 0;
      color: var(--mf-muted);
      font-size: 8px;
      line-height: 1.5;
      text-align: right;
    }

    .finding-ledger {
      margin-top: 10px;
    }

    .finding-entry {
      position: relative;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      border-bottom: 1px solid var(--c-rule);
      background: #fffef9;
      transition: background 150ms ease;
    }

    .finding-entry:hover,
    .finding-entry.is-selected {
      background: #fffaf0;
    }

    .finding-entry.is-selected::after {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 3px;
      background: var(--c-blue);
      content: "";
    }

    .finding-index {
      padding: 14px 8px;
      border-right: 1px solid var(--c-rule);
      color: #7d837f;
      font-family: var(--mf-mono);
      font-size: 9px;
      text-align: center;
    }

      border-right: 1px solid var(--c-rule);

      border-left: 1px solid var(--c-rule);

      height: 150px;
      overflow: hidden;
      border: 1px solid var(--c-rule);

        repeating-linear-gradient(0deg, rgba(28, 55, 81, 0.045) 0 1px, transparent 1px 22px),

      bottom: 0;

      content: "";

      width: 49%;

    .scan-line:nth-child(3) i {
      width: 84%;

    .scan-line:nth-child(4) i {
      width: 38%;

      border: 1px solid var(--c-rule);

    .limited-main {
      min-width: 0;
      padding: 18px;
      border-right: 1px solid var(--c-rule);
    }

    .limited-gates {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--c-rule);
    }

    .limited-gate {
      padding: 13px;
    }

    .limited-gate + .limited-gate {
      border-left: 1px solid var(--c-rule);
    }

    .limited-gate span {
      color: var(--mf-muted);
      font-family: var(--mf-mono);
      font-size: 7px;
      letter-spacing: 0.07em;
    }

    .limited-gate h2 {
      margin-top: 5px;
      font-family: var(--c-serif);
      font-size: 18px;
      font-weight: 600;
    }

    .limited-gate p {
      margin-top: 5px;
      color: var(--mf-muted);
      font-size: 9px;
      line-height: 1.65;
    }

    .limited-finding {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      margin-top: 10px;
      border: 1px solid var(--c-rule);
      border-bottom: 0;
    }

    .limited-finding:last-child {
      border-bottom: 1px solid var(--c-rule);
    }

    .limited-finding .num {
      padding: 11px 7px;
      border-right: 1px solid var(--c-rule);
      color: #7b827f;
      font-family: var(--mf-mono);
      font-size: 8px;
      text-align: center;
    }

    .limited-finding .copy {
      padding: 10px 11px;
    }

    .limited-finding h3 {
      font-family: var(--c-serif);
      font-size: 15px;
      font-weight: 600;
    }

    .limited-finding dl {
      display: grid;
      grid-template-columns: 45px minmax(0, 1fr);
      margin-top: 6px;
    }

    .limited-finding dt,
    .limited-finding dd {
      padding: 3px 0;
      border-top: 1px solid #ece7dc;
      font-size: 8px;
      line-height: 1.55;
    }

    .limited-finding dt {
      color: var(--mf-muted);
      font-family: var(--mf-mono);
      font-size: 7px;
    }

    .limited-finding dd {
      margin: 0;
    }

    .limited-side {
      padding: 17px;
      background: #f4efe4;
    }

    .limited-side h2 {
      font-family: var(--c-serif);
      font-size: 19px;
      font-weight: 600;
    }

    .limited-side p {
      margin-top: 5px;

    .dialog-config {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 12px;
    }

    .dialog-config div {
      padding: 8px 9px;
      border: 1px solid var(--c-rule);
      background: #faf7ee;
    }

    .dialog-config span {
      display: block;
      color: var(--mf-muted);
      font-family: var(--mf-mono);
      font-size: 8px;
    }

    .dialog-config strong {
      display: block;
      margin-top: 2px;
      font-family: var(--mf-mono);
      font-size: 10px;

    .dialog-note {
      margin-top: 12px;

    @media (max-width: 1240px) {
      .report-grid {
        grid-template-columns: 196px minmax(0, 1fr) 282px;
      }

      .audit-shell {
        width: calc(100% - 22px);
      }

      .audit-top {
        grid-template-columns: 225px minmax(0, 1fr) auto;
      }

      .audit-select {

      }
    }

    @media (max-width: 1080px) {
      .audit-top {
        grid-template-columns: 205px minmax(0, 1fr);
      }

      .audit-tools {
        grid-column: 1 / -1;

        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .audit-select {

      }

      .report-grid {

      }

      .timeline-column {

      .timeline-event::after {

      }

      }
    }

    @media (max-width: 900px) {
      .entry-heading,
      .report-heading,
      .empty-heading,
      .loading-heading {
        grid-template-columns: 1fr;
      }

      .entry-actions,
      .report-actions,
      .empty-actions,
      .loading-actions {
        justify-content: flex-start;
      }

      .entry-grid,
      .empty-grid,

      .empty-main,

      .verdict-ledger {

      .ledger-label {

      .ledger-verdict + .ledger-verdict {
        border-top: 1px solid var(--c-rule);
        border-left: 0;
      }

      .report-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .inspector-column {
        position: static;
        margin: 0 18px 18px;
      }

      .timeline-column {
        grid-template-columns: 150px minmax(0, 1fr);
      }

    @media (max-width: 660px) {
      .audit-top {

      }

      .audit-tools {

      }

      .audit-shell {
        width: calc(100% - 12px);
        margin-top: 6px;

      .case-ribbon {
        flex-wrap: wrap;
        gap: 3px 10px;
        padding: 7px 12px;
      }

      .case-ribbon .ribbon-push {
        margin-left: 0;
      }

      .entry-wrap,
      .report-wrap,
      .empty-wrap,
      .loading-wrap,
      .limited-wrap {
        padding: 17px 13px 24px;
      }

      .entry-heading,
      .report-heading,
      .empty-heading,
      .loading-heading {
        gap: 14px;
        padding-bottom: 15px;
      }

      .entry-heading h1,
      .report-heading h1,
      .empty-heading h1,
      .loading-heading h1 {
        font-size: 27px;
      }

      .entry-actions,
      .report-actions,
      .empty-actions,
      .loading-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .entry-actions .mf-button:first-child,
      .report-actions .mf-button:first-child,
      .empty-actions .mf-button:first-child,
      .loading-actions .mf-button:first-child {
        grid-column: 1 / -1;
      }

      .entry-main,
      .entry-side,
      .empty-main,
      .coverage-column,
      .loading-main,
      .loading-side,
      .limited-main,
      .limited-side {
        padding: 14px;
      }

      .gate-pair,
      .limited-gates {
        grid-template-columns: 1fr;
      }

      .gate + .gate,
      .limited-gate + .limited-gate {
        border-top: 1px solid var(--c-rule);
        border-left: 0;
      }

      .entry-digest {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .digest-cell:nth-child(2n) {
        border-right: 0;
      }

      .digest-cell:nth-child(-n + 2) {
        border-bottom: 1px solid var(--c-rule);
      }

      .entry-question {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .entry-question small {
        display: none;
      }

      .empty-questions {
        grid-template-columns: 1fr;
      }

      .empty-question {
        border-right: 0;
        border-bottom: 1px solid var(--c-rule);
      }

      .empty-question:nth-last-child(-n + 2) {
        border-bottom: 1px solid var(--c-rule);
      }

      .empty-question:last-child {
        border-bottom: 0;
      }

      .verdict-ledger {
        border-top: 0;
      }

      .timeline-column {
        display: block;
      }

      .timeline-head {
        border-right: 0;
        border-bottom: 1px solid var(--c-rule);
      }

      .timeline {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .timeline-event {
        border-right: 1px solid #ded7ca;
        border-bottom: 1px solid #ded7ca;
      }

      .timeline-event:nth-child(2n) {
        border-right: 0;
      }

      .ledger-column {
        padding: 14px 11px 0;
      }

      .ledger-toolbar {
        display: block;
      }

      .filter-row {
        justify-content: flex-start;
        margin-top: 9px;
      }

      .filter-note {

      }

      .finding-entry {
        grid-template-columns: 34px minmax(0, 1fr);
      }

      .finding-index {
        padding: 10px 4px;
      }

      .finding-head {
        display: block;
      }

      .severity-mark {
        display: inline-block;
        margin-top: 6px;
      }

      .claim-grid {
        grid-template-columns: 43px minmax(0, 1fr);
      }

      .experiment-row {
        grid-template-columns: 38px minmax(0, 1fr);
      }

      .experiment-actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .ask-ledger form {
        flex-direction: column;
      }

      .ask-ledger .mf-button {
        width: 100%;
      }

      .inspector-column {
        margin: 0 11px 14px;
      }

      .limited-grid {
        border-top: 0;
      }

      .limited-finding {
        grid-template-columns: 29px minmax(0, 1fr);
      }

      .loading-steps {

      .loading-step {

      .loading-step .step-state {
        grid-column: 2;

      .scan-visual {
        height: 120px;
      }

      .dialog-config {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#viewRoot">跳到审计内容</a>

  <header class="audit-top">
    <a class="audit-brand" href="index.html" aria-label="返回方案对比">
      <span class="audit-mark" aria-hidden="true">M</span>
      <span>
        <strong>ModelForge</strong>
        <small>Evidence audit / Training</small>
      </span>
    </a>
    <div class="audit-crumbs">
      <a href="index.html">方案对比</a>
      <span>/</span>
      <span>训练</span>
      <span>/</span>
      <strong>AI 证据审计</strong>
    </div>
    <div class="audit-tools">
      <span class="mf-demo-stamp">原型示例</span>
      <label>
        <span class="mf-sr-only">切换 Attempt</span>
        <select class="audit-select" id="attemptSelect" aria-label="切换 Attempt"></select>
      </label>
      <a class="mf-button" href="index.html">返回对比</a>
    </div>
  </header>

  <main id="viewRoot" tabindex="-1"></main>

  <div class="mf-dialog-backdrop" id="evidenceDialog" hidden>
    <section class="mf-dialog" role="dialog" aria-modal="true" aria-labelledby="evidenceDialogTitle" tabindex="-1">
      <header class="mf-dialog-head">
        <div>
          <span class="mf-eyebrow">EVIDENCE FILE · 原型示例</span>
          <h2 id="evidenceDialogTitle">证据原文</h2>
          <p>只复述已归档字段，不补写未上报值。</p>
        </div>
        <button class="mf-button quiet" type="button" data-dialog-close aria-label="关闭证据">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="mf-dialog-body" id="evidenceDialogBody"></div>
      <footer class="mf-dialog-actions">
        <button class="mf-button" type="button" data-dialog-close>关闭</button>
      </footer>
    </section>
  </div>

  <div class="mf-dialog-backdrop" id="applyDialog" hidden>
    <section class="mf-dialog" role="dialog" aria-modal="true" aria-labelledby="applyDialogTitle" aria-describedby="applyDialogDescription" tabindex="-1">
      <header class="mf-dialog-head">
        <div>
          <span class="mf-eyebrow">DRAFT CHANGE ORDER · 原型示例</span>
          <h2 id="applyDialogTitle">应用建议配置</h2>
          <p id="applyDialogDescription">只创建未提交的实验草稿；不修改历史 Attempt，不创建 GPU。</p>
        </div>
        <button class="mf-button quiet" type="button" data-dialog-close aria-label="关闭对话框">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="mf-dialog-body" id="applyDialogBody"></div>
      <footer class="mf-dialog-actions">
        <button class="mf-button quiet" type="button" data-dialog-close>先不应用</button>
        <button class="mf-button primary" type="button" id="confirmApply">创建配置草稿</button>
      </footer>
    </section>
  </div>

  <script src="shared/prototype-data.js"></script>
  <script src="shared/prototype-core.js"></script>
  <script>
    (() => {
      const data = window.MF_PROTOTYPE;
      const ui = window.MFUI;
      const root = document.getElementById("viewRoot");
      const attemptSelect = document.getElementById("attemptSelect");
      const evidenceDialogRoot = document.getElementById("evidenceDialog");
      const evidenceDialogBody = document.getElementById("evidenceDialogBody");
      const applyDialogRoot = document.getElementById("applyDialog");
      const applyDialogBody = document.getElementById("applyDialogBody");
      const confirmApply = document.getElementById("confirmApply");
      const evidenceDialog = ui.initDialog(evidenceDialogRoot);
      const applyDialog = ui.initDialog(applyDialogRoot);
      const params = new URLSearchParams(location.search);

      let attempt = data.getAttempt(params.get("attempt") || data.defaults.attempt);
      let view = ["report", "empty", "loading", "limited"].includes(params.get("view")) ? params.get("view") : "entry";
      let selectedEvidence = "";
      let filter = params.get("severity") || "all";
      let selectedFinding = "";
      let currentExperiment = null;
      let generationTimer = 0;
      let generationStep = 0;
      let limitedGenerated = false;

      const severityLabels = {
        all: "全部",
        blocked: "阻断",
        attention: "需关注",
        passed: "已通过",
        info: "提示",
        unknown: "无法判断",
      };

      attemptSelect.innerHTML = data.attempts.map((item) => {
        const state = item.state === "succeeded" ? "已成功" : item.state === "failed" ? "已失败" : "已取消";
        return `<option value="${ui.escapeHtml(item.id)}">${ui.escapeHtml(item.displayName)} · ${state}</option>`;
      }).join("");
      attemptSelect.value = attempt.id;

      function reportExists() {
        return Boolean(attempt.report?.exists || limitedGenerated);
      }

      function evidenceList() {
        return attempt.report?.evidence || [];
      }

      function selectedEvidenceItem() {
        return evidenceList().find((item) => item.id === selectedEvidence) || evidenceList()[0] || null;
      }

      function defaultEvidence() {
        return attempt.state === "failed" ? "E-F1" : "E-01";
      }

      function severityCount(findings, key) {
        if (key === "all") return findings.length;
        return findings.filter((item) => item.severity === key).length;
      }

      function layerClass(layer) {
        if (layer === "推断") return "inferred";
        if (layer === "建议") return "advice";
        if (layer === "限制") return "limit";
        return "observed";
      }

      function severityTone(severity) {
        return {
          blocked: "danger",
          attention: "warning",
          passed: "success",
          info: "neutral",
          unknown: "neutral",
        }[severity] || "neutral";
      }

      function statusClass() {
        if (attempt.state === "failed") return "danger";
        if (attempt.state === "cancelled") return "neutral";
        return "warning";
      }

      function statusText() {
        if (attempt.state === "failed") return "FAILED / 复盘";
        if (attempt.state === "cancelled") return "CANCELLED / 无报告";
        return "SUCCEEDED / 可用性未验证";
      }

      function evidenceCoverageFor(attemptData) {
        if (attemptData.evidenceCoverage) return attemptData.evidenceCoverage;
        if (attemptData.state === "failed") {
          return [
            ["Attempt snapshot", true, "身份与配置已冻结"],
            ["Metrics", false, "训练开始前失败"],
            ["Token preflight", false, "未形成"],
            ["Runtime report", false, "runtime 为空"],
            ["GPU 显存峰值", false, "未上报"],
            ["Execution manifest", false, "0 个文件"],
            ["Adapter", false, "未生成"],
            ["推理验收", false, "未到达"],
          ];
        }
        return [
          ["Attempt snapshot", true, "配置与身份已冻结"],
          ["Metrics", attemptData.metrics.trainCount > 0, `${attemptData.metrics.trainCount} train / ${attemptData.metrics.evalCount} eval`],
          ["Token preflight", attemptData.dataset.overflow === 0, "24 samples · overflow 0"],
          ["Runtime report", Boolean(attemptData.runtime), attemptData.runtime ? "lock 一致" : "未上报"],
          ["GPU 显存峰值", Boolean(attemptData.memory), attemptData.memory ? `${attemptData.memory.peakGiB} GiB` : "未上报"],
          ["Execution manifest", attemptData.execution.manifestFiles > 0, `${attemptData.execution.manifestFiles} 个文件`],
          ["Adapter", attemptData.adapters.length > 0, `${attemptData.adapters.length}/2 available`],
          ["推理验收", attemptData.inferenceAcceptance.state === "verified", attemptData.inferenceAcceptance.label],
        ];
      }

      function renderRibbon() {
        return `
          <div class="case-ribbon">
            <span>CASE <strong>${ui.escapeHtml(attempt.shortId)}</strong></span>
            <span>${ui.escapeHtml(attempt.model)} / ${ui.escapeHtml(attempt.method)}</span>
            <span>${ui.escapeHtml(attempt.gpu)}</span>
            <span class="ribbon-push">READ-ONLY EVIDENCE · 原型示例</span>
          </div>
        `;
      }

      function renderEntry() {
        const report = attempt.report;
        const isFailed = attempt.state === "failed";
        const isCancelled = attempt.state === "cancelled";
        const coverage = evidenceCoverageFor(attempt);
        const presentCount = coverage.filter((item) => item[1]).length;
        const gates = report?.exists
          ? `
            <div class="gate ${isFailed ? "failed" : ""}">
              <div class="gate-head">
                <span>TRAINING HEALTH</span>
                <span class="status-slash ${isFailed ? "danger" : "warning"}">${ui.escapeHtml(report.health.label)}</span>
              </div>
              <h2>${ui.escapeHtml(report.health.title)}</h2>
              <p>${ui.escapeHtml(report.health.detail)}</p>
              <div class="gate-facts">
                <span>${attempt.metrics.trainCount} train pts</span>
                <span>${attempt.metrics.evalCount} eval pts</span>
                <span>${attempt.memory ? `${attempt.memory.peakGiB} GiB peak` : "GPU —"}</span>
              </div>
            </div>
            <div class="gate delivery ${isFailed ? "failed" : ""}">
              <div class="gate-head">
                <span>DELIVERABILITY</span>
                <span class="status-slash ${isFailed ? "danger" : "warning"}">${ui.escapeHtml(report.delivery.label)}</span>
              </div>
              <h2>${ui.escapeHtml(report.delivery.title)}</h2>
              <p>${ui.escapeHtml(report.delivery.detail)}</p>
              <div class="gate-facts">
                <span>Adapter ${attempt.adapters.length}/2</span>
                <span>${ui.escapeHtml(attempt.inferenceAcceptance.label)}</span>
                <span>${attempt.execution.manifestFiles} files</span>
              </div>
            </div>
          `
          : `
            <div class="gate">
              <div class="gate-head">
                <span>TRAINING HEALTH</span>
                <span class="status-slash neutral">无法判断</span>
              </div>
              <h2>没有指标，不能评价训练健康度</h2>
              <p>Attempt 已取消，未形成 Train/Eval Loss、学习率或显存轨迹。</p>
              <div class="gate-facts"><span>Train 0 pts</span><span>Eval 0 pts</span><span>GPU —</span></div>
            </div>
            <div class="gate delivery">
              <div class="gate-head">
                <span>DELIVERABILITY</span>
                <span class="status-slash neutral">不可交付</span>
              </div>
              <h2>取消后不发布部分 Adapter</h2>
              <p>当前没有 Best / Final Adapter，推理验收未到达。</p>
              <div class="gate-facts"><span>Adapter 0/2</span><span>Inference 未到达</span><span>${attempt.execution.manifestFiles} files</span></div>
            </div>
          `;

        const aiCopy = report?.exists
          ? {
            eyebrow: isFailed ? "FAILURE REVIEW READY" : "AI REPORT READY",
            title: isFailed ? "阅读失败复盘" : "进入证据审计台",
            text: report.summary,
            primary: "打开 AI 报告",
            secondary: "重新生成报告",
            action: "open-report",
            secondaryAction: "regenerate",
          }
          : {
            eyebrow: "NO COMPLETE REPORT",
            title: "生成有限复盘",
            text: "现有证据只有 Attempt 快照、runtime 与部分执行文件。报告会明确写出缺口，而不是补造训练结论。",
            primary: "生成有限复盘",
            secondary: "查看证据覆盖",
            action: "generate",

              <div class="loading-heading">
                <div>
                  <div class="report-kicker">
                    <span class="mf-eyebrow">AI REPORT / GENERATING</span>
                    <span class="status-slash warning" id="generationLabel">正在读取证据</span>
                    <span class="mf-demo-stamp">原型示例</span>
                  </div>
                  <h1>正在把已归档事实整理成可追溯的结论账页</h1>
                  <div class="report-meta">
                    <span class="mono">ATTEMPT ${ui.escapeHtml(attempt.shortId)}</span>
                    <span>只读 Attempt、runtime、manifest、Adapter 与推理 Trials</span>
                  </div>
                </div>
                <div class="loading-actions">
                  <button class="mf-button quiet" type="button" data-action="cancel-generation">取消</button>
                </div>
              </div>
              <div class="loading-grid">
                <div class="loading-main" aria-live="polite">
                  <div class="scan-visual" aria-hidden="true">
                    <div class="scan-lines">
                      <div class="scan-line"><i></i><span>Attempt snapshot</span></div>
                      <div class="scan-line"><i></i><span>metrics / runtime</span></div>
                      <div class="scan-line"><i></i><span>manifest / adapter</span></div>
                      <div class="scan-line"><i></i><span>limitations</span></div>
                    </div>
                  </div>
                  <div class="loading-steps">
                    ${steps.map(([label, key], index) => `
                      <div class="loading-step ${index < generationStep ? "is-done" : index === generationStep ? "is-current" : ""}" data-loading-step="${index}">
                        <span class="step-index">${String(index + 1).padStart(2, "0")}</span>
                        <strong>${ui.escapeHtml(label)}</strong>
                        <span class="step-state">${index < generationStep ? "DONE" : index === generationStep ? "READING" : "QUEUED"}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
                <aside class="loading-side">
                  <span class="mf-eyebrow">WHAT WILL BE CHECKED</span>
                  <h2>报告生成边界</h2>
                  <p>只读取本 Attempt 已归档证据。没有的字段会显示“未上报/无法判断”，不会猜测数字或根因。</p>
                  <div class="loading-evidence">
                    <div><strong>HEALTH</strong>用 Loss / LR / Token / runtime / GPU 证据做有限判断。</div>
                    <div><strong>DELIVERY</strong>单独核对 Adapter 完整性、存储校验和推理验收关联。</div>
                    <div><strong>ADVISORY</strong>建议只创建未提交草稿，不绕过现有硬门禁。</div>
                  </div>
                </aside>
              </div>
            </div>
          </div>
        `;
      }

      function renderLimited() {
        const coverage = evidenceCoverageFor(attempt);
        root.innerHTML = `
          <div class="report-shell">
            ${renderRibbon()}
            <div class="limited-wrap">
              <div class="limited-heading">
                <div class="report-kicker">
                  <span class="mf-eyebrow">LIMITED REVIEW / NO METRICS</span>
                  <span class="status-slash neutral">证据不足</span>
                  <span class="mf-demo-stamp">原型示例</span>
                </div>
                <h1>这次 Attempt 已取消；现有证据只能说明“未形成训练结论”</h1>
                <p>已读取 Attempt 快照、runtime 与 ${attempt.execution.manifestFiles} 个执行文件。没有 metrics、Adapter 或推理验收，因此不能评价训练健康度或模型效果。</p>
                <div class="report-meta">
                  <span>有限复盘 <b class="mono">R-LIMITED-C01</b></span>
                  <span>生成于 11/06 20:20</span>
                  <span>${ui.escapeHtml(attempt.displayName)}</span>
                </div>
              </div>
              <div class="limited-callout">
                <span class="layer limit">限制</span>
                <span>这是“有限复盘”，不是失败根因或训练质量报告。所有缺失项显示为“未上报”，不以 0 代替。</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:11px">
                <button class="mf-button quiet" type="button" data-action="back-entry">返回详情</button>
                <button class="mf-button" type="button" data-action="regenerate">重新读取证据</button>
                <button class="mf-button primary" type="button" data-action="copy-summary">复制有限结论</button>
              </div>
              <div class="limited-grid" style="margin-top:12px">
                <div class="limited-main">
                  <div class="limited-gates">
                    <div class="limited-gate">
                      <span>TRAINING HEALTH</span>
                      <h2>没有训练指标，不能评价健康度</h2>
                      <p>取消前未形成 Train/Eval Loss、学习率或显存轨迹。</p>
                    </div>
                    <div class="limited-gate">
                      <span>DELIVERABILITY</span>
                      <h2>取消不发布部分 Adapter</h2>
                      <p>没有 Best / Final，推理验收未到达。</p>
                    </div>
                  </div>
                  <div class="limited-finding">
                    <div class="num">L-01</div>
                    <div class="copy">
                      <h3>Attempt 已取消，未发布部分产物</h3>
                      <dl>
                        <dt>观测</dt><dd>state=cancelled，outcome=cancelled；Adapter 记录为 0。</dd>
                        <dt>推断</dt><dd>符合“取消后不发布部分 Adapter”的门禁。</dd>
                        <dt>建议</dt><dd>保留证据，不把该 Attempt 送入推理试用。</dd>
                      </dl>
                    </div>
                  </div>
                  <div class="limited-finding">
                    <div class="num">L-02</div>
                    <div class="copy">
                      <h3>缺失训练指标，无法判断健康度</h3>
                      <dl>
                        <dt>观测</dt><dd>metrics=0，显存峰值为空，没有可绘制的 Loss 曲线。</dd>
                        <dt>推断</dt><dd>没有数据意味着“不知道”，不是“健康”。</dd>
                        <dt>建议</dt><dd>如需要训练结论，重新运行并确保指标归档。</dd>
                      </dl>
                    </div>
                  </div>
                  <div class="limits-box">
                    <strong>限制</strong>
                    <ul>
                      <li>不能从取消状态推断训练代码、数据或硬件有缺陷。</li>
                      <li>不能把 runtime_report 的存在当作训练已开始。</li>
                      <li>本报告不触发重试、不创建实例、不修改历史 Attempt。</li>
                    </ul>
                  </div>
                </div>
                <aside class="limited-side">
                  <span class="mf-eyebrow">EVIDENCE COVERAGE</span>
                  <h2>证据缺口账</h2>
                  <p>${coverage.filter((item) => item[1]).length} / 8 类证据可用。</p>
                  <div class="coverage-list" style="margin-top:9px">
                    ${coverage.map(([label, isPresent, note]) => `
                      <div class="coverage-item">
                        <i class="${isPresent ? "" : "missing"}"></i>
                        <div><strong>${ui.escapeHtml(label)}</strong><small>${ui.escapeHtml(note)}</small></div>
                        <em>${isPresent ? "YES" : "NO"}</em>
                      </div>
                    `).join("")}
                  </div>
                </aside>
              </div>
            </div>
          </div>
        `;
      }

      function render() {
        if (view === "loading") {
          renderLoading();
          return;
        }
        if (view === "report") {
          if (attempt.report?.exists) renderReport();
          else renderEmpty();
          return;
        }
        if (view === "limited") {
          renderLimited();
          return;
        }
        if (view === "empty") {
          renderEmpty();
          return;
        }
        renderEntry();
      }

      function bindAskBox() {
        const form = document.getElementById("askForm");
        const response = document.getElementById("askResponse");
        ui.initAskBox(form, response, {
          "为什么 Adapter available 不能写成模型可用？": "观测：Best / Final 为 available，只能证明两个 Adapter 文件可校验、可下载。推断：没有当前 Adapter ID 关联的独立推理服务 ready 与最小请求证据。建议：先完成推理验收，再讨论“可用”。",
          "训练健康吗？": "训练内信号可读：22 个 Train/LR 点、0 Token 溢出、runtime lock 一致、显存峰值已测。但只有 1 个 Eval 点，泛化趋势仍无法判断。",
          "为什么没有根因？": "失败 Attempt 的 metrics、runtime_report、manifest 与日志都为空；错误码只说明失败阶段，不足以区分凭据安装、连接或实例状态。",
        });
      }

      function rerenderFindings() {
        const list = document.getElementById("findingList");
        if (!list || !attempt.report) return;
        list.innerHTML = renderFindings(attempt.report.findings);
        const filterRow = root.querySelector(".filter-row");
        if (filterRow) filterRow.outerHTML = renderFilters(attempt.report.findings);
        const note = document.getElementById("filterNote");
        if (note) note.textContent = `当前显示 ${severityLabels[filter] || "全部"} · ${severityCount(attempt.report.findings, filter)} 条`;
      }

      function refreshInspector() {
        const item = selectedEvidenceItem();
        const inspector = document.getElementById("report-evidence");
        if (inspector) inspector.innerHTML = renderInspector(item);
        root.querySelectorAll("[data-evidence]").forEach((node) => {
          if (node.classList.contains("timeline-event")) {
            node.classList.toggle("is-active", node.dataset.evidence === selectedEvidence);
          }
        });
        root.querySelectorAll(".evidence-chip, .evidence-index-item").forEach((node) => {
          node.setAttribute("aria-pressed", String(node.dataset.evidence === selectedEvidence));
        });
      }

      function selectEvidence(id) {
        if (!id) return;
        selectedEvidence = id;
        refreshInspector();
      }

      function showEvidence(id) {
        const item = evidenceList().find((entry) => entry.id === id) || selectedEvidenceItem();
        if (!item) {
          ui.toast("当前没有可展开的证据。");
          return;
        }
        evidenceDialogBody.innerHTML = `
          <span class="mf-eyebrow">${ui.escapeHtml(item.kind)} · ${ui.escapeHtml(item.id)}</span>
          <h3 style="margin-top:6px;font-family:var(--c-serif);font-size:22px">${ui.escapeHtml(item.title)}</h3>
          <p style="margin-top:7px;color:var(--mf-muted);font-size:10px;line-height:1.7">${ui.escapeHtml(item.detail)}</p>
          <div class="field-pair" style="margin-top:12px">
            <div><span>SOURCE</span><strong>${ui.escapeHtml(item.source)}</strong></div>
            <div><span>PATH</span><strong>${ui.escapeHtml(item.path)}</strong></div>
            <div><span>VALUE</span><strong>${ui.escapeHtml(item.value)}</strong></div>
            <div><span>SAMPLES</span><strong>${ui.escapeHtml(item.samples)}</strong></div>
            <div><span>HASH</span><strong>${ui.escapeHtml(item.hash || "未提供")}</strong></div>
          </div>
          <div class="dialog-note"><strong>证据边界：</strong>${ui.escapeHtml(item.limitation)}</div>
        `;
        evidenceDialog.open(document.activeElement);
      }

      function openApply(experimentId) {
        const experiment = attempt.report?.experiments.find((item) => item.id === experimentId);
        if (!experiment) return;
        currentExperiment = experiment;
        applyDialogBody.innerHTML = `
          <p style="color:var(--mf-muted);font-size:10px;line-height:1.7">${ui.escapeHtml(experiment.title)}</p>
          <div class="dialog-config">
            ${(experiment.changes || []).map(([key, before, after]) => `
              <div><span>${ui.escapeHtml(key)}</span><strong>${ui.escapeHtml(before)} → ${ui.escapeHtml(after)}</strong></div>
            `).join("")}
          </div>
          <div class="dialog-note"><strong>草稿边界：</strong>${ui.escapeHtml(experiment.hypothesis)} 应用后仍需核对数据、基座、运行时兼容性与费用守卫。</div>
        `;
        applyDialog.open(document.activeElement);
      }

      function startGeneration() {
        if (generationTimer) window.clearTimeout(generationTimer);
        generationStep = 0;
        view = "loading";
        render();

        const advance = () => {
          if (view !== "loading") return;
          generationStep += 1;
          if (generationStep < 4) {
            const nodes = [...root.querySelectorAll("[data-loading-step]")];
            nodes.forEach((node, index) => {
              node.classList.toggle("is-done", index < generationStep);
              node.classList.toggle("is-current", index === generationStep);
              const state = node.querySelector(".step-state");
              if (state) state.textContent = index < generationStep ? "DONE" : index === generationStep ? "READING" : "QUEUED";
            });
            generationTimer = window.setTimeout(advance, 480);
            return;
          }
          if (attempt.report?.exists) {
            view = "report";
            selectedEvidence = defaultEvidence();
          } else {
            limitedGenerated = true;
            view = "limited";
          }
          render();
          window.scrollTo({top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
        };
        generationTimer = window.setTimeout(advance, 520);
      }

      root.addEventListener("click", async (event) => {
        const filterButton = event.target.closest("[data-filter]");
        const evidenceButton = event.target.closest("[data-evidence]");
        const actionNode = event.target.closest("[data-action]");

        if (filterButton) {
          filter = filterButton.dataset.filter;
          rerenderFindings();
          return;
        }
        if (evidenceButton) {
          selectEvidence(evidenceButton.dataset.evidence);
          if (evidenceButton.classList.contains("timeline-event")) {
            selectedFinding = "";
            root.querySelectorAll(".finding-entry").forEach((node) => node.classList.remove("is-selected"));
          }
          return;
        }
        if (!actionNode) return;
        const action = actionNode.dataset.action;
        if (action === "open-report") {
          view = "report";
          selectedEvidence = defaultEvidence();
          selectedFinding = "";
          filter = "all";
          render();
          document.getElementById("viewRoot")?.focus({preventScroll: true});
        } else if (action === "back-entry") {
          if (generationTimer) window.clearTimeout(generationTimer);
          view = "entry";
          render();
        } else if (action === "generate" || action === "regenerate") {
          startGeneration();
        } else if (action === "cancel-generation") {
          if (generationTimer) window.clearTimeout(generationTimer);
          view = "entry";
          render();
        } else if (action === "scroll-coverage") {
          document.getElementById("coverageSheet")?.scrollIntoView({behavior: "smooth", block: "center"});
        } else if (action === "copy-summary") {
          const text = attempt.report?.exists
            ? `${attempt.displayName}\n${attempt.report.summary}\n训练健康度：${attempt.report.health.label}\n可交付性：${attempt.report.delivery.label}`
            : "有限复盘：没有 metrics、Adapter 或推理验收；无法判断训练健康度。";
          const ok = await ui.copyText(text);
          ui.toast(ok ? "结论摘要已复制。" : "复制失败，请手动选择文本。");
        } else if (action === "copy-finding") {
          const finding = attempt.report?.findings.find((item) => item.id === actionNode.dataset.findingId);
          if (!finding) return;
          const text = `${finding.id} ${finding.title}\n观测：${finding.observation}\n推断：${finding.inference}\n建议：${finding.recommendation}\n证据：${finding.evidence.join(" / ")}`;
          const ok = await ui.copyText(text);
          ui.toast(ok ? "论断与边界已复制。" : "复制失败，请手动选择文本。");
        } else if (action === "copy-experiment") {
          const experiment = attempt.report?.experiments.find((item) => item.id === actionNode.dataset.experimentId);
          if (!experiment) return;
          const text = `${experiment.priority} ${experiment.title}\n假设：${experiment.hypothesis}\n预期：${experiment.expectation}\n证据：${experiment.evidence.join(" / ")}`;
          const ok = await ui.copyText(text);
          ui.toast(ok ? "实验建议已复制。" : "复制失败，请手动选择文本。");
        } else if (action === "apply-experiment") {
          openApply(actionNode.dataset.experimentId);
        } else if (action === "copy-evidence") {
          const item = evidenceList().find((entry) => entry.id === actionNode.dataset.evidenceId);
          if (!item) return;
          const text = `${item.id} ${item.title}\n${item.source}\n${item.value}\n限制：${item.limitation}`;
          const ok = await ui.copyText(text);
          ui.toast(ok ? "证据说明已复制。" : "复制失败，请手动选择文本。");
        } else if (action === "open-evidence") {
          showEvidence(actionNode.dataset.evidenceId);
        }
      });

      root.addEventListener("click", (event) => {
        const entry = event.target.closest(".finding-entry");
        if (!entry) return;
        selectedFinding = entry.dataset.findingId;
        root.querySelectorAll(".finding-entry").forEach((node) => node.classList.toggle("is-selected", node === entry));
      });

      attemptSelect.addEventListener("change", () => {
        if (generationTimer) window.clearTimeout(generationTimer);
        attempt = data.getAttempt(attemptSelect.value);
        filter = "all";
        selectedEvidence = defaultEvidence();
        selectedFinding = "";
        limitedGenerated = false;
        view = attempt.report?.exists ? "entry" : "empty";
        render();
        window.scrollTo({top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      });

      confirmApply.addEventListener("click", () => {
        if (!currentExperiment) return;
        applyDialog.close();
        ui.toast("已创建原型配置草稿；未提交训练、未创建 GPU、未修改当前 Attempt。");
      });

      const requestedView = params.get("view");
      if (requestedView === "loading") {
        startGeneration();
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
